services:
  - type: web
    name: corebiq-gstr1-tool
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: corebiq-gstr1-data
      mountPath: /var/data/corebiq
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_FIREBASE_AUTH
        value: "true"
      - key: DATA_ROOT
        value: /var/data/corebiq
      - key: FIREBASE_PROJECT_ID
        value: hexa-5d208
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
