<div data-ng-controller="errorreturnsctrl" data-ng-init="validateUserMstrRtnPrd();getSupplierDetails();">
    <div class="tabpane">
        <div class="row">
            <div class="col-sm-12">

                <div class="table-responsive">

                    <table class="table tbl inv table-bordered" ng-show="ErrorList.length">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <input type="checkbox" class="chkbx" ng-model="selectAll" ng-click="checkAll()" />
                                    <label for="checkbox_all"></label>
                                </th>
                                <th class="gstTblHeadr ctnTblHdr reg m-cir sort" data-ng-bind="trans.LBL_REC_GSTN_UIN"
                                    ng-click="sort('rtin')"></th>
                                <th class="gstTblHeadr m100TblHdr reg m-cir sort" data-ng-bind="trans.LBL_DOC_NO"
                                    ng-click="sort('inum')"></th>
                                <th class="gstTblHeadr dtTblHdr reg m-cir sort" data-ng-bind="trans.LBL_DOC_DT"
                                    ng-click="sort('idt')"></th>
                                <th class="gstTblHeadr m100TblHdr reg m-cir sort"
                                    data-ng-bind="trans.LBL_TOT_VAL_SUP_MD" ng-click="sort('val')"></th>
                                <th class="gstTblHeadr psTblHdr reg m-cir sort" data-ng-bind="trans.LBL_POS"
                                    ng-click="sort('pos')"></th>
                                <th class="gstTblHeadr spTblHdr reg m-cir" data-ng-bind="trans.LBL_SUPPLY_TYPE"></th>
                                <th class="gstTblHeadr spTblHdr reg m-cir" data-ng-bind="trans.LBL_DOC_TYP"
                                    style="min-width: 320px;"></th>
                                <th class="gstTblHeadr errMsg" data-ng-bind="trans.LBL_Error_Message"></th>
                                <th class="gstTblHeadr m100TblHdr" data-ng-bind="trans.LBL_ACTIONS"></th>
                            </tr>

                        </thead>

                        <tbody>
                            <tr dir-paginate="y in ErrorList | filter:searchInvNum  | orderBy:sortBy:sortReverse | itemsPerPage: pageSize"
                                current-page="currentPage" total-items="totalAvailable" ng-form="invFrm"
                                ng-init="y.old_inum=y.inum">

                                <td class="text-center">
                                    <input type="checkbox" class="chkbx" ng-model="y.select" />
                                    <label for="checkbox_all"></label>
                                </td>

                                <td
                                    data-ng-class="{'has-error':  (invFrm.rtin.$error.pattern || invFrm.rtin.$error.required)}">
                                    <input type="text" capitalize="toUpperCase"
                                        class="form-control formedit" name="rtin" data-ng-model="y.rtin"
                                        ng-required="true" data-ng-class="y.obj" 
                                        ng-change="isRtinAsEcomGstn(0,y.rtin,invFrm);onRtinChange(y.rtin,invFrm);getPosBasedOnRtin(y);"     
                                                                           data-ng-disabled="!invFrm.edb" data-ng-class="y.obj"  maxlength="15"
                                        />
                                        <span class="err" data-ng-show="invFrm.rtin.$error.required"
                                        data-ng-bind="trans.ERR_MANDATORY"></span>
                                       
                                    <span class="err" style="display: block;"
                                        data-ng-show="invFrm.rtin && invFrm.rtin.$error.pattern && !showDropdown"
                                        data-ng-bind="trans.LBL_VALID_GSTIN"></span>
                                    
                                    <span class="err" style="margin-left:-3%"
                                        data-ng-show="invFrm.rtin && invFrm.rtin.$invalid && !invFrm.rtin.$error.pattern"
                                        >{{rtinmsg}}</span>
                                    
                               
                                </td>
                               
                              


                                <td
                                    data-ng-class="{'has-error': (invFrm.inum.$error.pattern || invFrm.inum.$error.required || invFrm.inum.$invalid)}">
                                    <input type="text" class="form-control formedit" name="inum"
                                        data-ng-model="y.inum"
                                        data-ng-pattern="validations.formats.invoiceregex"
                                        data-ng-change="isDuplicateInvoice(0,y.inum,invFrm)" data-ng-model-options="{updateOb:'blur'}" maxlength="16"
                                        ng-required="true" data-ng-disabled="!invFrm.edb" />
                                        <span class="err" data-ng-show="invFrm.inum.$error.required"
                                        data-ng-bind="trans.ERR_MANDATORY"></span>
                                        <span class="err" data-ng-show="invFrm.inum.$error.pattern"
                                        data-ng-bind="trans.ERR_INV_CHAR"></span>
                                 
                                </td>


                                <td
                                    data-ng-class="{'has-error': (invFrm.idt.$error.pattern || invFrm.idt.$error.required || invFrm.idt.$invalid)}">
                                    <div class="datepicker-icon input-group">
                                        <div class="datepicker-icon input-group">
                                            <i class="fa fa-calendar"></i>
                                            <input name="idt" class="form-control date-picker"
                                            data-ng-change="docDateLimit(0,y.idt,invFrm)"
                                            data-ng-pattern="/^(0?[1-9]|[12][0-9]|3[01])[\-](0?[1-9]|1[012])[\-\-]\d{4}$/"
                                                data-ng-model="y.idt" data-datepicker ng-required="true"
                                                data-min-years="{{minYearsAllowed}}" placeholder="DD-MM-YYYY"
                                                data-min-date="{{minDate()}}" data-max-date="{{datefunc()}}"
                                                data-ng-disabled="!invFrm.edb" />
                                            <span class="input-group-addon"><span class="fa fa-calendar"></span></span>
                                            
                                        </div>
                                        <span class="err" data-ng-show="invFrm && invFrm.idt.$error.required"
                                        data-ng-bind="trans.ERR_MANDATORY"></span>
                                    <span class="err" data-ng-show="invFrm && invFrm.idt.$error.pattern"
                                        data-ng-bind="trans.ERR_INV_CHAR"></span>
                                    <span class="err"
                                        data-ng-show="invFrm.idt && invFrm.idt.$invalid">{{invdtmsg}}</span>
                                    </div>

                                </td>

                                <td data-ng-class="{'has-error': (invFrm.val.$error.required)}">
                                    <div class="datepicker-icon input-group">
                                        <input type="text" class="form-control text-right" name="val"
                                            data-ng-model="y.val" data-ng-change="setPristine(y,invFrm)"
                                            data-format="currency" data-id="invval" data-fraction="2" data-ng-focus="freezeOrder('val')" ng-required="true"
                                            data-ng-disabled="!invFrm.edb" />
                                            <span class="err" data-ng-show="invFrm.val.$error.required"
                                            data-ng-bind="trans.ERR_MANDATORY"></span>
                                    </div>

                                </td>
                                <td data-ng-class="{'has-error': (invFrm.pos.$error.required)}">
                                    <select name="pos" class="form-control"
                                        ng-options="opt.cd as opt.cd+'-'+opt.nm for opt in StateList"
                                        ng-model="y.pos"
                                        ng-change="onCtinChange(y);onPosChange(y);"
                                        data-ng-disabled="!invFrm.edb" ng-required="true">
                                        <option value="">Select</option>
                                    </select>
                                    

                                </td>
                              
             
                                <td>
                                    <select class="form-control"
                                        ng-options="option.name for option in suplyList track by option.name"
                                        ng-model="y.sp_typ" data-ng-disabled="!invFrm.edb || y.pos"></select>
                                </td>

                                <td
                                    data-ng-class="{'has-error':(!y.inv_typ || invFrm.inv_typ.$error.required || invFrm.inv_typ.$invalid)}">

                                    <select class="form-control" name="inv_typ"
                                        ng-options="type.c as type.n for type in InvTypeListForB2b.b2b15"
                                        ng-model="y.inv_typ" data-ng-disabled="!invFrm.edb"
                                        data-ng-change="onCtinChange(y);onPosChange(y);validateNoteType('inv_typ',0,y,invFrm)"
                                        ng-required="true"></select>

                                </td>
                                <td class="text-center">
                                    <div class="text-center">
                                        <span  data-ng-bind="y.error_msg"></span></div>

                                </td>
                                
                                <td class="text-center newinv">
                                    
                                            <button type="button" class="btn btn-sm btn-primary" 
                                            ng-if="invFrm.edb" data-ng-click="gotoAddItems(y)" 
                                            tabindex="0" data-ng-disabled="invFrm.$invalid"><i class="fa fa-plus-circle" aria-hidden="true"></i></button>
                                    <button type="button" class="btn btn-sm btn-primary" ng-if="invFrm.edb"
                                        data-ng-click="invFrm.edb=!invFrm.edb;invFrm.$setPristine();updateInvoice(y);onSetDiffPer(y);"
                                        tabindex="0" data-ng-disabled="invFrm.$invalid || invFrm.$pristine"><i
                                            class="fa fa-save" aria-hidden="true"></i></button>
                                    <button type="button" class="btn btn-sm btn-primary" ng-hide="invFrm.edb"
                                        data-ng-click="invFrm.edb = !invFrm.edb " tabindex="0"><i class="fa fa-pencil"
                                            aria-hidden="true"></i></button>
                                </td>
                            </tr>
                        </tbody>
                        
                    </table>
                </div>
                <span ng-show="!ErrorList.length"> No Invoices for {{sectionListSelected.nm}}</span>
                <div class="text-center">
                    <wrap-dir-pagination></wrap-dir-pagination>
                </div>
            </div>
        </div>
        <div class="btn-toolbar">
            <button type="button" class="btn btn-primary pull-left" ng-show="ErrorList.length"
                ng-click="deleteSelectedRows()">Delete</button>
        </div>
    </div>
</div>
