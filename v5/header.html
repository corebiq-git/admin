<style>
/* =========================================================
   COREBIQ HEADER - GEMINI / MATERIAL 3 STYLE
   ========================================================= */

#core-header {
    width: 100%;
    height: 72px;
    min-height: 72px;
    background: var(--surface, #FFFFFF);
    border-bottom: 1px solid var(--outline-variant, #E1E4E2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: relative;
    z-index: 900;
    font-family: 'Outfit', 'Google Sans', 'Inter', sans-serif;
}

/* LEFT */

.core-header-left {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
}

.core-menu-btn {
    width: 48px;
    height: 48px;
    border: none;
    background: transparent;
    border-radius: 50%; /* M3 Circular Icon Button */
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-muted, #444746);
    flex-shrink: 0;
    transition: background-color 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
}

.core-menu-btn:hover {
    background: var(--surface-container-high, #E3E7ED);
    color: var(--text-main, #1F1F1F);
}

.core-menu-btn .material-symbols-rounded {
    font-size: 24px;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}

.core-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.core-logo {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    object-fit: contain;
}

.core-brand-text {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.core-brand-name {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.5px;
    color: var(--text-main, #1F1F1F);
    line-height: 1.2;
}

.core-brand-sub {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted, #444746);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* RIGHT */

.core-header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* SEARCH */

.search-container {
    width: 280px;
    height: 48px;
    background: var(--surface-container, #F0F4F9);
    border: none;
    border-radius: 100px; /* M3 Pill Shape */
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    transition: background-color 0.2s, box-shadow 0.2s;
    margin-right: 16px;
}

.search-container:focus-within {
    background: var(--surface, #FFFFFF);
    box-shadow: 0 4px 8px rgba(0,0,0,0.08); /* Elevated state */
}

.search-container .material-symbols-rounded {
    font-size: 20px;
    color: var(--text-muted, #444746);
}

.search-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text-main, #1F1F1F);
    font-size: 14px;
    font-weight: 400;
    font-family: 'Outfit', 'Google Sans', 'Inter', sans-serif;
}

.search-input::placeholder {
    color: var(--outline, #747775);
}

/* MOBILE SEARCH BUTTON */

.mobile-search-btn {
    display: none;
    width: 48px;
    height: 48px;
    border: none;
    background: transparent;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    color: var(--text-muted, #444746);
    cursor: pointer;
    transition: background-color 0.2s;
}
.mobile-search-btn:hover {
    background: var(--surface-container-high, #E3E7ED);
}

.mobile-search-btn .material-symbols-rounded {
    font-size: 24px;
}

/* MOBILE SEARCH PANEL */

.mobile-search-panel {
    display: none;
    position: absolute;
    left: 12px;
    right: 12px;
    top: calc(100% + 8px);
    background: var(--surface, #FFFFFF);
    border: 1px solid var(--outline-variant, #E1E4E2);
    border-radius: 24px; /* M3 Large Radius */
    padding: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); /* M3 Elevation 3 */
    z-index: 9999;
}

.mobile-search-panel.open {
    display: flex;
}

.mobile-search-inner {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-container, #F0F4F9);
    border-radius: 100px;
    padding: 12px 16px;
}

.mobile-search-inner .material-symbols-rounded {
    font-size: 20px;
    color: var(--text-muted, #444746);
}

.mobile-search-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text-main, #1F1F1F);
    font-size: 14px;
    font-family: 'Outfit', 'Google Sans', 'Inter', sans-serif;
}

/* CLOCK */

.header-clock {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: 16px;
}

.metric-round {
    position: relative;
    width: 44px;
    height: 44px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.clock-svg {
    position: absolute;
    transform: rotate(-90deg);
    width: 44px;
    height: 44px;
}

.clock-svg circle {
    fill: none;
    stroke-width: 3.5;
    stroke-linecap: round;
}

.bg-track {
    stroke: var(--surface-container-high, #E3E7ED);
}

.progress-arc {
    transition: stroke-dashoffset .5s cubic-bezier(.4,0,.2,1);
}

.center-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    text-align: center;
    line-height: 1;
}

.main-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main, #1F1F1F);
    margin-bottom: 2px;
}

.sub-label {
    font-size: 8px;
    font-weight: 500;
    color: var(--text-muted, #444746);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.blue-pair .progress-arc {
    stroke: var(--primary, #0A56D1); /* M3 Primary Blue */
}

.yellow-pair .progress-arc {
    stroke: var(--warning, #B36B00); /* M3 Warning */
}

/* NOTIFICATION */

.core-notification-btn {
    position: relative;
    width: 48px;
    height: 48px;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-muted, #444746);
    transition: background-color 0.2s;
}

.core-notification-btn:hover {
    background: var(--surface-container-high, #E3E7ED);
}

.core-notification-btn .material-symbols-rounded {
    font-size: 24px;
}

.bell-anim {
    animation: ring 2s infinite;
    transform-origin: top center;
    color: var(--primary, #0A56D1) !important;
    font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; /* Filled when active */
}

@keyframes ring {
    0% { transform: rotate(0); }
    10% { transform: rotate(15deg); }
    20% { transform: rotate(-10deg); }
    30% { transform: rotate(5deg); }
    40% { transform: rotate(-5deg); }
    50% { transform: rotate(0); }
    100% { transform: rotate(0); }
}

/* USER */

.core-user-box {
    height: 48px;
    padding: 4px 16px 4px 6px;
    border: 1px solid var(--outline-variant, #E1E4E2);
    background: transparent;
    border-radius: 100px; /* M3 Pill Shape */
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: background-color 0.2s;
}

.core-user-box:hover {
    background: var(--surface-container, #F0F4F9);
}

.core-user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--primary-container, #D3E3FD);
    color: var(--on-primary-container, #041E49);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
}

.core-user-info {
    display: flex;
    flex-direction: column;
    min-width: 55px;
}

.core-user-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-main, #1F1F1F);
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.core-user-role {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted, #444746);
    text-transform: capitalize;
}

/* LOGOUT */

.logout-btn {
    margin-left: 4px;
    width: 48px;
    height: 48px;
    padding: 0;
    background: transparent;
    color: var(--danger, #B3261E);
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
}

.logout-btn .material-symbols-rounded {
    font-size: 24px;
}

.logout-btn:hover {
    background: var(--danger-container, #F9DEDC);
    color: var(--on-danger-container, #410E0B);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:900px) {

    #core-header {
        height: 64px;
        min-height: 64px;
        padding: 0 16px;
    }

    .core-brand-sub {
        display: none;
    }

    .core-brand-name {
        font-size: 18px;
    }

    .core-logo {
        width: 32px;
        height: 32px;
    }

    .search-container {
        display: none;
    }

    .mobile-search-btn {
        display: flex;
    }

    .header-clock .metric-round:nth-child(3),
    .header-clock .metric-round:nth-child(4) {
        display: none;
    }

    .core-user-info {
        display: none;
    }

    .core-user-box {
        width: 40px;
        height: 40px;
        padding: 0;
        border: none;
        justify-content: center;
    }
    
    .core-user-avatar {
        width: 32px;
        height: 32px;
    }

    .logout-btn {
        display: none;
    }

    .core-header-right {
        gap: 4px;
    }
}

@media(max-width:500px) {

    #core-header {
        padding: 0 8px;
    }

    .core-header-left {
        gap: 8px;
    }

    .header-clock {
        display: none;
    }

    .core-notification-btn {
        display: none;
    }
}
</style>


<header id="core-header">

    <!-- LEFT -->
    <div class="core-header-left">

        <button
            type="button"
            class="core-menu-btn"
            onclick="window.toggleMenu()"
            aria-label="Menu">

            <span class="material-symbols-rounded">
                menu
            </span>

        </button>


        <div class="core-brand">

            <img
                src="assets/logo.png"

                alt="COREBIQ">

            <div class="core-brand-text">

                <div class="core-brand-name">
                    COREBIQ
                </div>

                <div class="core-brand-sub">
                    Business Intelligence
                </div>

            </div>

        </div>

    </div>


    <!-- RIGHT -->
    <div class="core-header-right">


        <!-- DESKTOP SEARCH -->

        <div class="search-container">

            <span class="material-symbols-rounded">
                search
            </span>

            <input
                id="desktopSearchInput"
                class="search-input"
                type="search"
                placeholder="Search..."

        </div>

            <div class="metric-round blue-pair">

                <svg
                    class="clock-svg"

                        class="bg-track"

                    </circle>

                    <circle
                        id="dd-arc"

                        cx="25"

            <div class="metric-round blue-pair">

                <svg

</header>


<script>

(function () {

    /* =====================================================
       MOBILE SEARCH
       ===================================================== */

    window.toggleMobileSearch = function () {

        const panel =
            document.getElementById('mobileSearchPanel');

        if (!panel) return;

        panel.classList.toggle('open');

        if (panel.classList.contains('open')) {

            setTimeout(function () {

                const input =
                    document.getElementById(
                        'mobileSearchInput'
                    );

                if (input) input.focus();

            }, 100);

        }

    };


    /* =====================================================
       USER DISPLAY
       ===================================================== */

    window.updateHeaderUser = function () {

        const user =
            window.currentUser;

        if (!user) return;


        const email =
            user.email || '';


        const name =
            email
                ? email.split('@')[0]
                : 'User';


        const avatar =
            name
                .charAt(0)
                .toUpperCase();


        const nameEl =
            document.getElementById(
                'core-user-name'
            );

        const roleEl =
            document.getElementById(
                'core-user-role'
            );

        const avatarEl =
            document.getElementById(
                'core-user-avatar'
            );


        if (nameEl) {

            nameEl.innerText =
                name;

        }


        if (roleEl) {

            roleEl.innerText =
                user.role ||
                'user';

        }


        if (avatarEl) {

            avatarEl.innerText =
                avatar;

        }

    };


    /* =====================================================
       SEARCH
       ===================================================== */

    function performSearch(value) {

        const search =
            String(value || '')
                .trim()
                .toLowerCase();

        if (!search) return;


        /*
         * Search currently loaded visible module.
         * This intentionally does not touch Firebase.
         */

        const active =
            document.querySelector(
                '.view-section.active'
            );

        if (!active) return;


        const text =
            active.innerText
                .toLowerCase();


        if (!text.includes(search)) {

            console.log(
                'No result:',
                search
            );

        }

    }


    const desktopSearch =
        document.getElementById(
            'desktopSearchInput'
        );


    if (desktopSearch) {

        desktopSearch.addEventListener(
            'keydown',
            function (event) {

                if (event.key === 'Enter') {

                    performSearch(
                        desktopSearch.value
                    );

                }

            }
        );

    }


    const mobileSearch =
        document.getElementById(
            'mobileSearchInput'
        );


    if (mobileSearch) {

        mobileSearch.addEventListener(
            'keydown',
            function (event) {

                if (event.key === 'Enter') {

                    performSearch(
                        mobileSearch.value
                    );

                }

            }
        );

    }


    /* =====================================================
       UPDATE HEADER AFTER DASHBOARD AUTH
       ===================================================== */

    function waitForUser() {

        if (window.currentUser) {

            window.updateHeaderUser();

            return;

        }


        setTimeout(
            waitForUser,
            250
        );

    }


    waitForUser();

})();

</script>
