<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Task Flow - MD3</title>

  <!-- Google Font: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<div id="transaction-module">

  <style>
    /* ==========================================================================
       MATERIAL DESIGN 3 & GEMINI CSS VARIABLES
       ========================================================================== */
    :root {
      --md-ref-typeface: 'Outfit', sans-serif;
      --transition-speed: 0.25s;

      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-extra-large: 28px;
      --md-shape-corner-full: 9999px;
    }

    /* LIGHT THEME (DEFAULT) */
    [data-theme="light"] {
      --md-sys-color-background: #F8F9FF;
      --md-sys-color-surface: #FFFFFF;
      --md-sys-color-surface-container: #EEF2F9;
      --md-sys-color-surface-container-high: #E2E8F0;

      --md-sys-color-primary: #0B57D0;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #D3E3FD;

      --md-sys-color-outline: #74777F;
      --md-sys-color-outline-variant: #C4C6D0;

      --md-sys-color-on-background: #191C20;
      --md-sys-color-on-surface: #191C20;
      --md-sys-color-on-surface-variant: #44474E;

      /* Status Badges */
      --status-pending-bg: #E8F0FE;
      --status-pending-fg: #1A73E8;
      --status-completed-bg: #E6F4EA;
      --status-completed-fg: #137333;
      --status-cancelled-bg: #FCE8E6;
      --status-cancelled-fg: #C5221F;

      /* Gemini Accents & Shadows */
      --gemini-gradient-primary: linear-gradient(135deg, #1A73E8 0%, #7C4DFF 50%, #E52592 100%);
      --gemini-gradient-surface: linear-gradient(180deg, #FFFFFF 0%, #F4F7FC 100%);
      --gemini-glow: 0 8px 24px rgba(26, 115, 232, 0.18);
      --md-elevation-1: 0px 1px 3px rgba(0, 0, 0, 0.08), 0px 2px 6px rgba(0, 0, 0, 0.04);
      --md-elevation-3: 0px 8px 24px rgba(0, 0, 0, 0.16);
    }

    /* DARK THEME */
    [data-theme="dark"] {
      --md-sys-color-background: #0F1117;
      --md-sys-color-surface: #181B22;
      --md-sys-color-surface-container: #20242F;
      --md-sys-color-surface-container-high: #2A2F3D;

      --md-sys-color-primary: #A8C7FA;
      --md-sys-color-on-primary: #062E6F;
      --md-sys-color-primary-container: #004A77;

      --md-sys-color-outline: #8E919A;
      --md-sys-color-outline-variant: #44474E;

      --md-sys-color-on-background: #E2E2E9;
      --md-sys-color-on-surface: #E2E2E9;
      --md-sys-color-on-surface-variant: #C4C6D0;

      /* Status Badges */
      --status-pending-bg: rgba(168, 199, 250, 0.15);
      --status-pending-fg: #A8C7FA;
      --status-completed-bg: rgba(133, 248, 157, 0.15);
      --status-completed-fg: #85F89D;
      --status-cancelled-bg: rgba(242, 184, 181, 0.15);
      --status-cancelled-fg: #F2B8B5;

      /* Gemini Accents & Shadows */
      --gemini-gradient-primary: linear-gradient(135deg, #4285F4 0%, #9B51E0 50%, #F2994A 100%);
      --gemini-gradient-surface: linear-gradient(180deg, rgba(32, 36, 47, 0.8) 0%, rgba(20, 23, 33, 0.95) 100%);
      --gemini-glow: 0 8px 32px rgba(138, 180, 248, 0.2);
      --md-elevation-1: 0px 1px 3px rgba(0, 0, 0, 0.3);
      --md-elevation-3: 0px 12px 32px rgba(0, 0, 0, 0.6);
    }

    /* Reset & Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--md-ref-typeface);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px 80px;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-sparkle {
      background: var(--gemini-gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 28px;
      font-weight: bold;
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      width: 42px;
      height: 42px;
      border-radius: var(--md-shape-corner-full);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--md-sys-color-surface-container-high);
      transform: scale(1.04);
    }

    .md3-fab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gemini-gradient-primary);
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: var(--md-shape-corner-large);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: var(--gemini-glow);
      transition: all 0.2s ease;
    }

    .md3-fab:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    /* View Banner */
    .view-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--md-sys-color-primary);
      background: var(--md-sys-color-primary-container);
      padding: 8px 14px;
      border-radius: var(--md-shape-corner-full);
      width: fit-content;
    }

    /* Task List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    /* Task Card */
    .task-card {
      background: var(--gemini-gradient-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-extra-large);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: visible; /* Allows action menu to render outside without clipping */
      box-shadow: var(--md-elevation-1);
      transition: transform 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
      z-index: 1;
    }

    /* Elevate z-index of card when action menu is active */
    .task-card.menu-open {
      z-index: 100;
    }

    .task-card:hover {
      border-color: var(--md-sys-color-primary);
    }

    .task-card.is-completed {
      opacity: 0.75;
    }

    .task-card.is-cancelled {
      opacity: 0.6;
    }

    .task-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-head-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--md-sys-color-primary);
      background: var(--md-sys-color-surface-container-high);
      padding: 4px 10px;
      border-radius: var(--md-shape-corner-small);
    }

    /* Status Badges */
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--md-shape-corner-full);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-transform: capitalize;
    }

    .status-badge.pending {
      background: var(--status-pending-bg);
      color: var(--status-pending-fg);
    }

    .status-badge.completed {
      background: var(--status-completed-bg);
      color: var(--status-completed-fg);
    }

    .status-badge.cancelled {
      background: var(--status-cancelled-bg);
      color: var(--status-cancelled-fg);
    }

    .task-title {
      font-size: 17px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      line-height: 1.35;
    }

    .task-card.is-completed .task-title {
      text-decoration: line-through;
    }

    .task-time-info {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .task-time-info span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .task-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      margin-top: 2px;
    }

    .cal-sync-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-primary);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--md-shape-corner-full);
      transition: background 0.2s ease;
    }

    .cal-sync-btn:hover {
      background: var(--md-sys-color-primary-container);
    }

    /* Action Menu Wrapper & Popup Fixes */
    .action-menu-wrapper {
      position: relative;
    }

    .action-trigger-btn {
      background: transparent;
      border: none;
      color: var(--md-sys-color-outline);
      cursor: pointer;
      border-radius: var(--md-shape-corner-full);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .action-trigger-btn:hover {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
    }

    /* Fixed Floating Menu Layering */
    .dropdown-menu {
      position: absolute;
      top: 36px;
      right: 0;
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-medium);
      box-shadow: var(--md-elevation-3);
      width: 180px;
      display: none;
      flex-direction: column;
      z-index: 1000;
      padding: 6px 0;
      opacity: 0;
      transform: scale(0.95);
      transform-origin: top right;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .dropdown-menu.show {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .dropdown-item:hover {
      background: var(--md-sys-color-surface-container-high);
    }

    .dropdown-item.delete {
      color: var(--status-cancelled-fg);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      margin-top: 4px;
      padding-top: 8px;
    }

    /* Modal Backdrop */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 2000;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      width: 100%;
      max-width: 440px;
      border-radius: var(--md-shape-corner-extra-large);
      padding: 24px;
      box-shadow: var(--md-elevation-3);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      font-size: 20px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      letter-spacing: 0.5px;
    }

    .input-field {
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline);
      color: var(--md-sys-color-on-surface);
      border-radius: var(--md-shape-corner-medium);
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-text {
      background: transparent;
      border: none;
      color: var(--md-sys-color-primary);
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: var(--md-shape-corner-full);
    }

    .btn-filled {
      background: var(--gemini-gradient-primary);
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      border-radius: var(--md-shape-corner-full);
      box-shadow: var(--gemini-glow);
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--md-sys-color-outline);
    }

    .empty-state span {
      font-size: 48px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand">
        <span class="material-symbols-outlined brand-sparkle">auto_awesome</span>
        <h1>Tasks</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">
          <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
        </button>
        <button class="md3-fab" id="openModalBtn">
          <span class="material-symbols-outlined">add</span>
          Add Task
        </button>
      </div>
    </header>

    <!-- Upcoming Date Banner -->
    <div class="view-badge">
      <span class="material-symbols-outlined" style="font-size: 16px;">sort</span>
      Upcoming Pending First • Finished at Bottom
    </div>

    <!-- Task List Container -->
    <main class="task-list" id="taskListContainer">
      <!-- Dynamic Tasks Rendered Here -->
    </main>
  </div>

  <!-- Add/Edit Task Modal Dialog -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-header" id="modalTitle">Create New Task</div>
      
      <form id="taskForm">
        <input type="hidden" id="editingTaskId" value="" />

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div class="input-group">
            <label for="taskHead">TASK HEAD (CATEGORY)</label>
            <input type="text" id="taskHead" class="input-field" placeholder="e.g. Work, Personal, Fitness" required />
          </div>

          <div class="input-group">
            <label for="taskName">TASK NAME</label>
            <input type="text" id="taskName" class="input-field" placeholder="What needs to be done?" required />
          </div>

          <div class="row-2">
            <div class="input-group">
              <label for="taskDate">DATE</label>
              <input type="date" id="taskDate" class="input-field" required />
            </div>

            <div class="input-group">
              <label for="taskTime">TIME</label>
              <input type="time" id="taskTime" class="input-field" required />
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-text" id="closeModalBtn">Cancel</button>
          <button type="submit" class="btn-filled" id="submitBtn">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial State (Default added tasks start with status: 'pending')
    let tasks = [
      {
        id: '1',
        head: 'Work',
        name: 'Review Q4 Roadmap & Gemini Specs',
        date: '2026-10-06',
        time: '10:00',
        status: 'completed'
      },
      {
        id: '2',
        head: 'Personal',
        name: 'Evening Gym Session',
        date: '2026-10-08',
        time: '18:30',
        status: 'pending'
      }
    ];

    // Light Theme Default & Toggle Logic
    const htmlElem = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');

    function toggleTheme() {
      const currentTheme = htmlElem.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      htmlElem.setAttribute('data-theme', newTheme);
      themeIcon.textContent = newTheme === 'light' ? 'dark_mode' : 'light_mode';
    }

    themeToggleBtn.addEventListener('click', toggleTheme);

    // DOM Elements
    const taskListContainer = document.getElementById('taskListContainer');
    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const taskForm = document.getElementById('taskForm');
    const editingTaskIdInput = document.getElementById('editingTaskId');
    const modalTitle = document.getElementById('modalTitle');
    const submitBtn = document.getElementById('submitBtn');

    openModalBtn.addEventListener('click', openModalForCreate);
    closeModalBtn.addEventListener('click', closeModal);

    function openModalForCreate() {
      editingTaskIdInput.value = '';
      modalTitle.textContent = 'Create New Task';
      submitBtn.textContent = 'Save Task';
      taskForm.reset();
      document.getElementById('taskDate').valueAsDate = new Date();
      modalOverlay.classList.add('active');
    }

    function openModalForEdit(task) {
      editingTaskIdInput.value = task.id;
      modalTitle.textContent = 'Edit Task';
      submitBtn.textContent = 'Update Task';
      document.getElementById('taskHead').value = task.head;
      document.getElementById('taskName').value = task.name;
      document.getElementById('taskDate').value = task.date;
      document.getElementById('taskTime').value = task.time;
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      taskForm.reset();
      editingTaskIdInput.value = '';
    }

    // Google Calendar Sync URL
    function generateGoogleCalendarUrl(task) {
      const [year, month, day] = task.date.split('-');
      const [hours, minutes] = task.time.split(':');

      const startDate = new Date(Date.UTC(year, month - 1, day, hours, minutes));
      const endDate = new Date(startDate.getTime() + 30 * 60 * 1000);

      const formatISO = (d) => d.toISOString().replace(/-|:|\.\d\d\d/g, '');

      const dates = `${formatISO(startDate)}/${formatISO(endDate)}`;
      const details = encodeURIComponent(`Category: ${task.head}\nStatus: ${task.status.toUpperCase()}\nCreated via Gemini Task Flow.`);
      const title = encodeURIComponent(`[${task.head}] ${task.name}`);

      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}&add=1`;
    }

    function getStatusIcon(status) {
      switch(status) {
        case 'completed': return 'check_circle';
        case 'cancelled': return 'cancel';
        default: return 'schedule';
      }
    }

    // Toggle Action Dropdown & Elevate Card Stack Context
    function toggleDropdown(event, taskId) {
      event.stopPropagation();

      // Close all existing open dropdowns & remove open state from cards
      document.querySelectorAll('.dropdown-menu').forEach(menu => {
        if (menu.id !== `dropdown-${taskId}`) {
          menu.classList.remove('show');
        }
      });
      document.querySelectorAll('.task-card').forEach(card => card.classList.remove('menu-open'));

      const targetMenu = document.getElementById(`dropdown-${taskId}`);
      const parentCard = document.getElementById(`card-${taskId}`);

      if (targetMenu && parentCard) {
        const isShowing = targetMenu.classList.contains('show');
        if (!isShowing) {
          targetMenu.classList.add('show');
          parentCard.classList.add('menu-open');
        } else {
          targetMenu.classList.remove('show');
          parentCard.classList.remove('menu-open');
        }
      }
    }

    // Global click listener to close dropdowns
    document.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
      document.querySelectorAll('.task-card').forEach(card => card.classList.remove('menu-open'));
    });

    function updateTaskStatus(taskId, newStatus) {
      const task = tasks.find(t => t.id === taskId);
      if (task) {
        task.status = newStatus;
        renderTasks();
      }
    }

    function deleteTask(taskId) {
      tasks = tasks.filter(t => t.id !== taskId);
      renderTasks();
    }

    function triggerEditTask(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (task) {
        openModalForEdit(task);
      }
    }

    // Render Function with Auto-Sorting (Pending Top, Completed/Cancelled Bottom)
    function renderTasks() {
      taskListContainer.innerHTML = '';

      if (tasks.length === 0) {
        taskListContainer.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-outlined">task_alt</span>
            <p>No tasks remaining. Click "+ Add Task" to create one.</p>
          </div>
        `;
        return;
      }

      // Priority Status Order: Pending (1) -> Completed (2) -> Cancelled (3)
      const statusWeight = {
        'pending': 1,
        'completed': 2,
        'cancelled': 3
      };

      // SORTING LOGIC:
      // 1. Pending tasks stay at top; Completed and Cancelled automatically go down.
      // 2. Within the same status group, upcoming dates are sorted top.
      tasks.sort((a, b) => {
        if (statusWeight[a.status] !== statusWeight[b.status]) {
          return statusWeight[a.status] - statusWeight[b.status];
        }
        return new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`);
      });

      tasks.forEach(task => {
        const calUrl = generateGoogleCalendarUrl(task);
        const formattedDate = new Date(`${task.date}T${task.time}`).toLocaleDateString('en-US', {
          weekday: 'short',
          month: 'short',
          day: 'numeric'
        });

        const statusClass = `is-${task.status}`;

        const card = document.createElement('div');
        card.className = `task-card ${statusClass}`;
        card.id = `card-${task.id}`;
        card.innerHTML = `
          <div class="task-card-header">
            <div class="tag-group">
              <span class="task-head-tag">${escapeHtml(task.head)}</span>
              <span class="status-badge ${task.status}">
                <span class="material-symbols-outlined" style="font-size: 14px;">${getStatusIcon(task.status)}</span>
                ${task.status}
              </span>
            </div>

            <!-- Action Menu Wrapper -->
            <div class="action-menu-wrapper">
              <button class="action-trigger-btn" onclick="toggleDropdown(event, '${task.id}')" title="Task Actions">
                <span class="material-symbols-outlined">more_vert</span>
              </button>

              <!-- Dropdown Action Popup -->
              <div class="dropdown-menu" id="dropdown-${task.id}">
                <button class="dropdown-item" onclick="triggerEditTask('${task.id}')">
                  <span class="material-symbols-outlined" style="font-size: 18px;">edit</span> Edit Task
                </button>
                <button class="dropdown-item" onclick="updateTaskStatus('${task.id}', 'completed')">
                  <span class="material-symbols-outlined" style="font-size: 18px; color: var(--status-completed-fg);">check_circle</span> Mark Completed
                </button>
                <button class="dropdown-item" onclick="updateTaskStatus('${task.id}', 'cancelled')">
                  <span class="material-symbols-outlined" style="font-size: 18px; color: var(--status-cancelled-fg);">block</span> Mark Cancelled
                </button>
                <button class="dropdown-item" onclick="updateTaskStatus('${task.id}', 'pending')">
                  <span class="material-symbols-outlined" style="font-size: 18px; color: var(--status-pending-fg);">schedule</span> Set to Pending
                </button>
                <button class="dropdown-item delete" onclick="deleteTask('${task.id}')">
                  <span class="material-symbols-outlined" style="font-size: 18px;">delete</span> Delete Task
                </button>
              </div>
            </div>
          </div>

          <div class="task-title">${escapeHtml(task.name)}</div>

          <div class="task-time-info">
            <span>
              <span class="material-symbols-outlined" style="font-size: 16px;">calendar_today</span>
              ${formattedDate}
            </span>
            <span>
              <span class="material-symbols-outlined" style="font-size: 16px;">schedule</span>
              ${task.time}
            </span>
          </div>

          <div class="task-footer">
            <a href="${calUrl}" target="_blank" rel="noopener noreferrer" class="cal-sync-btn">
              <span class="material-symbols-outlined" style="font-size: 16px;">event_upcoming</span>
              Sync Calendar & Reminder
            </a>
          </div>
        `;
        taskListContainer.appendChild(card);
      });
    }

    // Form Submission Handler
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const editingId = editingTaskIdInput.value;
      const head = document.getElementById('taskHead').value;
      const name = document.getElementById('taskName').value;
      const date = document.getElementById('taskDate').value;
      const time = document.getElementById('taskTime').value;

      if (editingId) {
        const task = tasks.find(t => t.id === editingId);
        if (task) {
          task.head = head;
          task.name = name;
          task.date = date;
          task.time = time;
        }
      } else {
        const newTask = {
          id: Date.now().toString(),
          head,
          name,
          date,
          time,
          status: 'pending' // Default Status
        };
        tasks.push(newTask);

        const autoSync = confirm("Task created! Would you like to sync it to Google Calendar?");
        if (autoSync) {
          window.open(generateGoogleCalendarUrl(newTask), '_blank');
        }
      }

      renderTasks();
      closeModal();
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial Execution
    renderTasks();
  </script>
</body>
</html>
