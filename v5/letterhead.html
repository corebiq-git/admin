<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material 3 Letterhead Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link rel="stylesheet" href="letterhead.css">
</head>
<body>

<div id="letterhead-module">
    <!-- SECTION 1: Form Input -->
    <div id="form-section" class="form-section view-transition opacity-100 p-4">
        <div class="form-container">
            <div class="flex items-center gap-3 mb-8">
                <span class="material-symbols-rounded text-blue-600 text-3xl">edit_document</span>
                <h1 class="text-2xl font-brand font-semibold">Letterhead Details</h1>
            </div>
            
            <form id="letterhead-form" onsubmit="generateLetterhead(event)">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2">
                    <!-- Company Info -->
                    <div class="col-span-1 md:col-span-2"><h2 class="text-lg font-medium text-gray-800 border-b pb-2 mb-4">Company Details</h2></div>
                    
                    <div class="input-group">
                        <label class="input-label" for="companyName">Company Name</label>
                        <input type="text" id="companyName" class="md3-input" required value="Nexus Innovations">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="tagline">Tagline</label>
                        <input type="text" id="tagline" class="md3-input" value="Technology & Design">
                    </div>
                    <div class="input-group col-span-1 md:col-span-2">
                        <label class="input-label" for="companyAddress">Company Address</label>
                        <textarea id="companyAddress" class="md3-input h-24" style="min-height: 80px;" required>Headquarters
1280 Infinite Loop
Silicon Valley, CA 94025</textarea>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="companyEmail">Contact Email</label>
                        <input type="email" id="companyEmail" class="md3-input" value="contact@nexus-innovations.demo">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="companyPhone">Contact Phone</label>
                        <input type="text" id="companyPhone" class="md3-input" value="+1 (555) 019-8273">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="companyWebsite">Website</label>
                        <input type="text" id="companyWebsite" class="md3-input" value="www.nexus-innovations.demo">
                    </div>
                    
                    <!-- Letter Details -->
                    <div class="col-span-1 md:col-span-2 mt-4"><h2 class="text-lg font-medium text-gray-800 border-b pb-2 mb-4">Letter Content</h2></div>
                    
                    <div class="input-group">
                        <label class="input-label" for="referenceNo">Reference Number</label>
                        <input type="text" id="referenceNo" class="md3-input" value="NX/2026/10-A1">
                    </div>
                    <div class="input-group col-span-1 md:col-span-2">
                        <label class="input-label" for="recipientDetails">To (Recipient Details)</label>
                        <textarea id="recipientDetails" class="md3-input h-24" style="min-height: 80px;" required>Strategic Partners & Associates,
Global Operations Division.</textarea>
                    </div>
                    <div class="input-group col-span-1 md:col-span-2">
                        <label class="input-label" for="letterSubject">Subject</label>
                        <input type="text" id="letterSubject" class="md3-input" required value="Official Communication & Document Verification">
                    </div>
                    <div class="input-group col-span-1 md:col-span-2">
                        <label class="input-label" for="letterBody">Letter Body</label>
                        <textarea id="letterBody" class="md3-input" required>Dear Valued Partner,

We are writing to formally share the updated protocols for our upcoming Q4 integration phase. This document serves as a verified communication channel designed utilizing our latest Material Design 3 specifications.

As we transition into the new operational framework, please ensure that all department leads review the enclosed guidelines.

Should you require further clarification, please do not hesitate to reach out.

Thank you for your continued dedication and collaboration.</textarea>
                    </div>
                    
                    <!-- Signatory -->
                    <div class="col-span-1 md:col-span-2 mt-4"><h2 class="text-lg font-medium text-gray-800 border-b pb-2 mb-4">Signatory Details</h2></div>
                    
                    <div class="input-group">
                        <label class="input-label" for="signatoryName">Signatory Name</label>
                        <input type="text" id="signatoryName" class="md3-input" required value="Sarah Jenkins">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="signatoryTitle">Signatory Title</label>
                        <input type="text" id="signatoryTitle" class="md3-input" value="Director of Operations">
                    </div>
                </div>

                <div class="mt-8 flex justify-end">
                    <button type="submit" class="md3-btn md3-btn-primary w-full md:w-auto">
                        <span class="material-symbols-rounded">visibility</span>
                        Generate & Preview Letterhead
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Action Toolbar (Visible only in preview mode) -->
    <div id="action-bar" class="no-print action-bar">
        <button onclick="backToForm()" class="md3-btn md3-btn-icon mr-auto" title="Back to Edit">
            <span class="material-symbols-rounded">arrow_back</span>
        </button>

        <button onclick="window.print()" class="md3-btn md3-btn-tonal" title="Preview and Print">
            <span class="material-symbols-rounded">print</span>
            <span class="hidden sm:inline">Print</span>
        </button>

        <button onclick="downloadPDF()" class="md3-btn md3-btn-primary" title="Download as PDF">
            <span class="material-symbols-rounded">download</span>
            <span class="hidden sm:inline">Download</span>
        </button>

        <div class="w-px h-8 bg-gray-300 mx-1 hidden sm:block"></div>

        <button onclick="shareWhatsApp()" class="md3-btn md3-btn-icon" title="Send via WhatsApp">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
            </svg>
        </button>

        <button onclick="shareEmail()" class="md3-btn md3-btn-icon" title="Send via Email">
            <span class="material-symbols-rounded">mail</span>
        </button>
    </div>

    <!-- SECTION 2: Generated Letterhead Preview -->
    <div id="preview-section" class="paper-wrapper view-transition opacity-0 absolute top-0 w-full pointer-events-none">
        <div id="document-content" class="paper-container p-10 md:p-16 lg:p-20">
            <div class="header-accent"></div>

            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                <img src="assets/logo.png" alt="Watermark" class="w-[300px] h-auto opacity-[0.04]" onerror="this.onerror=null; this.src='https://placehold.co/400x400/D3E3FD/0A56D9?text=Watermark'">
            </div>

            <header class="flex justify-between items-start border-b border-gray-200 pb-8 mb-8 relative z-10">
                <div class="flex items-center gap-4">
                    <img src="assets/logo.png" alt="Company Logo" class="w-14 h-14 object-contain" onerror="this.onerror=null; this.src='https://placehold.co/100x100/D3E3FD/0A56D9?text=Logo'">
                    <img src="assets/name.png" alt="Company Name and Tagline" class="h-10 object-contain" onerror="this.onerror=null; this.src='https://placehold.co/250x60/transparent/1F1F1F?text=Name+%2B+Tagline'">
                    
                    <!-- Hidden text to keep JS data-binding intact for PDF metadata & Shares -->
                    <div class="hidden">
                        <h1 id="out-companyName"></h1>
                        <p id="out-tagline"></p>
                    </div>
                </div>
                
                <div class="text-right text-sm" style="color: var(--md-sys-color-on-surface-variant)">
                    <div id="out-companyAddress" class="font-medium text-gray-900 whitespace-pre-line"></div>
                    <p id="out-companyEmail" class="mt-2 text-blue-600"></p>
                    <p id="out-companyPhone"></p>
                </div>
            </header>

            <main class="flex-grow text-base leading-relaxed text-gray-700 relative z-10">
                <div class="mb-8 flex justify-between">
                    <p class="font-medium text-gray-900">Date: <span id="out-date"></span></p>
                    <p class="font-medium text-gray-900">Ref: <span id="out-referenceNo"></span></p>
                </div>

                <div class="mb-6">
                    <p class="font-semibold text-gray-900">To,</p>
                    <div id="out-recipientDetails" class="whitespace-pre-line"></div>
                </div>

                <div class="mb-6 font-semibold text-gray-900">
                    <p>Subject: <span id="out-letterSubject"></span></p>
                </div>

                <div id="out-letterBody" class="space-y-4 text-gray-700 whitespace-pre-line">
                    <!-- Letter body injected here -->
                </div>

                <div class="mt-12">
                    <p>Sincerely,</p>
                    <div class="mt-4 mb-2">
                        <span id="out-signatorySignature" class="font-brand text-3xl text-blue-900 opacity-80" style="font-family: 'Outfit', cursive; font-style: italic;"></span>
                    </div>
                    <p id="out-signatoryName" class="font-semibold text-gray-900"></p>
                    <p id="out-signatoryTitle" class="text-sm text-gray-500"></p>
                    <p id="out-signatoryCompany" class="text-sm text-gray-500"></p>
                </div>
            </main>

            <footer class="mt-12 pt-6 border-t border-gray-200 flex flex-col sm:flex-row justify-between items-center text-xs text-gray-400 gap-4 text-center sm:text-left relative z-10">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-rounded" style="font-size: 16px;">public</span>
                    <span id="out-companyWebsite"></span>
                </div>
                <div>
                    <p>Official Business Communication</p>
                </div>
                <div class="flex items-center gap-2">
                    <span>Confidential Document</span>
                    <span class="material-symbols-rounded" style="font-size: 16px;">lock</span>
                </div>
            </footer>
        </div>
    </div>

    <script>
        // Set dynamic date
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('out-date').textContent = new Date().toLocaleDateString('en-US', dateOptions);

        // Global variables for sharing
        let currentSubject = "";
        let currentCompanyName = "";

        function generateLetterhead(event) {
            event.preventDefault();

            // 1. Gather Data
            const data = {
                companyName: document.getElementById('companyName').value,
                tagline: document.getElementById('tagline').value,
                companyAddress: document.getElementById('companyAddress').value,
                companyEmail: document.getElementById('companyEmail').value,
                companyPhone: document.getElementById('companyPhone').value,
                companyWebsite: document.getElementById('companyWebsite').value,
                
                referenceNo: document.getElementById('referenceNo').value,
                recipientDetails: document.getElementById('recipientDetails').value,
                letterSubject: document.getElementById('letterSubject').value,
                letterBody: document.getElementById('letterBody').value,
                
                signatoryName: document.getElementById('signatoryName').value,
                signatoryTitle: document.getElementById('signatoryTitle').value
            };

            // Save for share functions
            currentSubject = data.letterSubject;
            currentCompanyName = data.companyName;

            // 2. Populate Preview
            document.getElementById('out-companyName').textContent = data.companyName;
            document.getElementById('out-tagline').textContent = data.tagline;
            document.getElementById('out-companyAddress').textContent = data.companyAddress;
            document.getElementById('out-companyEmail').textContent = data.companyEmail;
            document.getElementById('out-companyPhone').textContent = data.companyPhone;
            document.getElementById('out-companyWebsite').textContent = data.companyWebsite;

            document.getElementById('out-referenceNo').textContent = data.referenceNo;
            document.getElementById('out-recipientDetails').textContent = data.recipientDetails;
            document.getElementById('out-letterSubject').textContent = data.letterSubject;
            
            // Format body text with paragraphs
            const formattedBody = data.letterBody.split('\n').map(para => `<p>${para}</p>`).join('');
            document.getElementById('out-letterBody').innerHTML = formattedBody;

            document.getElementById('out-signatorySignature').textContent = data.signatoryName;
            document.getElementById('out-signatoryName').textContent = data.signatoryName;
            document.getElementById('out-signatoryTitle').textContent = data.signatoryTitle;
            document.getElementById('out-signatoryCompany').textContent = data.companyName;

            // 3. Switch Views (Hide Form, Show Preview & Action Bar)
            const formSection = document.getElementById('form-section');
            const previewSection = document.getElementById('preview-section');
            const actionBar = document.getElementById('action-bar');

            formSection.classList.remove('opacity-100');
            formSection.classList.add('opacity-0');
            
            setTimeout(() => {
                formSection.style.display = 'none';
                
                previewSection.classList.add('visible');
                previewSection.style.position = 'relative'; // Remove absolute positioning
                previewSection.classList.remove('pointer-events-none');
                
                // Small delay to allow display:block to render before opacity transition
                setTimeout(() => {
                    previewSection.classList.remove('opacity-0');
                    previewSection.classList.add('opacity-100');
                    actionBar.classList.add('visible');
                    window.scrollTo(0,0);
                }, 50);
            }, 300);
        }

        function backToForm() {
            const formSection = document.getElementById('form-section');
            const previewSection = document.getElementById('preview-section');
            const actionBar = document.getElementById('action-bar');

            previewSection.classList.remove('opacity-100');
            previewSection.classList.add('opacity-0');
            actionBar.classList.remove('visible');

            setTimeout(() => {
                previewSection.classList.remove('visible');
                previewSection.style.position = 'absolute';
                previewSection.classList.add('pointer-events-none');
                
                formSection.style.display = 'block';
                
                setTimeout(() => {
                    formSection.classList.remove('opacity-0');
                    formSection.classList.add('opacity-100');
                    window.scrollTo(0,0);
                }, 50);
            }, 300);
        }

        // Sharing logic
        function getShareMessage() {
            return `Hello,\n\nPlease find attached the official document regarding: "${currentSubject}" from ${currentCompanyName}.\n\nLet us know if you require any further information.\n\nBest regards,\n${currentCompanyName}`;
        }

        function shareWhatsApp() {
            const text = encodeURIComponent(getShareMessage());
            const url = `https://wa.me/?text=${text}`;
            window.open(url, '_blank');
        }

        function shareEmail() {
            const subject = encodeURIComponent(`Document from ${currentCompanyName}: ${currentSubject}`);
            const body = encodeURIComponent(getShareMessage());
            const url = `mailto:?subject=${subject}&body=${body}`;
            window.location.href = url;
        }

        function downloadPDF() {
            const element = document.getElementById('document-content');
            
            // Temporary styles for cleaner PDF generation
            const originalRadius = element.style.borderRadius;
            const originalShadow = element.style.boxShadow;
            element.style.borderRadius = '0';
            element.style.boxShadow = 'none';

            const opt = {
                margin:       [10, 0, 10, 0],
                filename:     `${currentCompanyName.replace(/\s+/g, '_')}_Document.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                // Restore styles
                element.style.borderRadius = originalRadius;
                element.style.boxShadow = originalShadow;
            });
        }
    </script>
</body>
</html>
