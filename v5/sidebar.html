<style>
    /* =========================================================
       SIDEBAR BASE - GEMINI / MATERIAL 3 STYLE
       ========================================================= */

    .sidebar-inner-wrapper {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        height: 100%;
        font-family: 'Outfit', 'Google Sans', 'Inter', sans-serif;
        background: var(--surface, #FFFFFF);
    }


    /* =========================================================
       SIDEBAR HEADER / STRA CARE LOGO
       ========================================================= */

    .sidebar-header {
        position: sticky;
        top: 0;
        background: var(--surface, #FFFFFF);
        z-index: 10;
        border-bottom: 1px solid var(--outline-variant, #E1E4E2);
        
        /* Aligning padding and height with the main header */
        padding: 12px 24px; 
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 72px;
    }

    .sidebar-brand {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .sidebar-logo {
        display: block;
        width: 100%;
        max-width: 170px;
        height: auto;
        max-height: 48px;
        object-fit: contain;
    }

    .close-menu {
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--text-muted, #444746);

        display: flex;
        align-items: center;
        justify-content: center;

        /* M3 Circular Icon Button */
        width: 48px;
        height: 48px;
        border-radius: 50%;
        transition: background-color 0.2s, color 0.2s;
        -webkit-tap-highlight-color: transparent;
    }

    .close-menu:hover {
        background: var(--surface-container-high, #E3E7ED);
        color: var(--text-main, #1F1F1F);
    }

    .close-menu .material-symbols-rounded {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }


    /* =========================================================
       NAVIGATION
       ========================================================= */

    .sidebar-nav {
        flex: 1;
        overflow-y: auto;

        padding-top: 16px;
        padding-bottom: 24px;

        display: flex;
        flex-direction: column;
        gap: 4px;

        scrollbar-width: thin;
    }


    /* =========================================================
       NAVIGATION LINKS
       ========================================================= */

    .nav-link {
        display: flex;
        align-items: center;

        /* M3 spacing and pill shape */
        width: calc(100% - 32px);
        margin: 0 16px;
        padding: 14px 18px;

        border: none;
        background: transparent;

        text-align: left;
        cursor: pointer;

        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted, #444746);
        border-radius: 100px; /* Perfect M3 Pill */

        transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1), color 0.2s;
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
    }

    .nav-link:hover {
        background: rgba(31, 31, 31, 0.08); /* Standard M3 state layer */
        color: var(--text-main, #1F1F1F);
    }

    .nav-link.active {
        /* Gemini Blue Active State */
        background: var(--primary-container, #D3E3FD);
        color: var(--on-primary-container, #041E49);
        font-weight: 600;
    }

    .nav-link .material-symbols-rounded {
        font-size: 24px;
        margin-right: 14px;
        color: inherit;
        transition: font-variation-settings 0.2s;
        flex-shrink: 0;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .nav-link.active .material-symbols-rounded {
        /* Filled icon for active state */
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        color: var(--primary, #0A56D1);
    }


    /* =========================================================
       DIVIDERS
       ========================================================= */

    .nav-divider {
        height: 1px;
        background: var(--outline-variant, #E1E4E2);
        margin: 12px 24px;
        flex-shrink: 0;
    }


    /* =========================================================
       BADGES
       ========================================================= */

    .menu-badge {
        margin-left: auto;
        background: var(--primary, #0A56D1);
        color: #FFFFFF;
        padding: 2px 10px;
        border-radius: 100px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2px;
    }

    .menu-badge.pending {
        background: var(--warning, #B36B00);
        color: #FFFFFF;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .sidebar-footer {
        padding: 20px 24px;
        border-top: 1px solid var(--outline-variant, #E1E4E2);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--surface-container, #F0F4F9); /* Subtle M3 container background */
        margin-top: auto;
        flex-shrink: 0;
    }

    .footer-logo {
        width: 80px;
        height: auto;
        margin-bottom: 8px;
        object-fit: contain;
        opacity: 0.9;
    }

    .footer-app-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-main, #1F1F1F);
        margin-bottom: 4px;
        text-align: center;
    }

    .footer-version {
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted, #444746);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }


    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (min-width: 769px) {
        .close-menu {
            display: none;
        }

        .sidebar-header {
            justify-content: center;
        }
    }


    /* =========================================================
       MOBILE SIDEBAR
       ========================================================= */

    @media (max-width: 768px) {
        .sidebar-header {
            padding: 12px 16px;
            min-height: 72px;
            justify-content: space-between;
        }

        .sidebar-brand {
            justify-content: flex-start;
        }

        .sidebar-logo {
            width: 100%;
            max-width: 160px;
            max-height: 48px;
        }

        .close-menu {
            display: flex;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            margin-right: -8px; /* Optically align to right edge */
        }

        .close-menu .material-symbols-rounded {
            font-size: 24px;
        }

        .sidebar-nav {
            padding-top: 12px;
            padding-bottom: 24px;
        }

        .nav-link {
            width: calc(100% - 24px);
            margin: 0 12px;
            padding: 14px 16px;
        }

        .nav-divider {
            margin: 12px 20px;
        }
    }
</style>
