<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CM Contacts</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  
  <!-- Google Fonts: Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --m3-bg: #F0F4F9;
      --m3-surface: #F7F9FC;
      --m3-surface-container: #E9EEF6;
      --m3-surface-container-high: #DDE3EA;
      
      --m3-primary: #0A56D0;
      --m3-on-primary: #FFFFFF;
      --m3-primary-container: #D3E3FD;
      --m3-on-primary-container: #041E49;
      
      --m3-text-main: #1F1F1F;
      --m3-text-variant: #444746;
      --m3-text-muted: #74777F;
      
      --m3-outline-variant: #C4C7C5;
      --m3-whatsapp: #25D366;
      --m3-error: #B3261E;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Outfit', system-ui, sans-serif;
      background-color: #1a1c1e;
      color: var(--m3-text-main);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
    }

    /* Shared Mobile Frame */
    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      background-color: var(--m3-surface);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Views */
    .view {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      min-height: 0;
    }
    .view.active {
      display: flex;
    }

    /* Top Search Header */
    .search-header {
      flex-shrink: 0;
      width: 100%;
      padding: max(10px, env(safe-area-inset-top, 0px)) 12px 10px;
      background: var(--m3-surface);
      border-bottom: 1px solid var(--m3-surface-container);
      z-index: 40;
    }
    .search-bar {
      width: 100%;
      height: 48px;
      background-color: var(--m3-surface-container);
      border-radius: 9999px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s, box-shadow 0.2s;
    }
    .search-bar:focus-within {
      background-color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .search-bar input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--m3-text-main);
    }

    /* Toolbar for List/Grid Toggle */
    .view-toolbar {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 6px 14px;
      background: var(--m3-surface);
      border-bottom: 1px solid var(--m3-surface-container);
    }
    .view-toggle {
      display: flex;
      gap: 2px;
      padding: 2px;
      border-radius: 10px;
      background: var(--m3-surface-container);
    }
    .view-toggle button {
      width: 34px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--m3-text-variant);
      cursor: pointer;
    }
    .view-toggle button.active {
      background: #fff;
      color: var(--m3-primary);
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }

    /* Scrollable Workspace */
    .content-scroll {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .content-scroll::-webkit-scrollbar { display: none; }
    .content-scroll { scrollbar-width: none; }

    /* Contacts List & Cards */
    #contactList {
      width: 100%;
    }
    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      gap: 12px;
      border-bottom: 1px solid var(--m3-surface-container);
      background: #FFFFFF;
      transition: background 0.15s ease;
    }
    .contact-item:active {
      background: var(--m3-surface-container);
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--m3-primary-container);
      color: var(--m3-on-primary-container);
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      font-weight: 600;
      flex-shrink: 0;
    }
    .contact-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .contact-name {
      color: var(--m3-text-main);
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .contact-id {
      color: var(--m3-text-muted);
      font-size: 0.8rem;
    }
    .contact-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .action-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--m3-surface-container);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--m3-text-variant);
      text-decoration: none;
      transition: transform 0.1s, background-color 0.15s;
    }
    .action-btn:active {
      transform: scale(0.92);
      background-color: var(--m3-surface-container-high);
    }
    .action-call { color: var(--m3-primary); }
    .action-whatsapp { color: var(--m3-whatsapp); }
    .action-save { color: var(--m3-text-muted); }
    .action-danger { color: var(--m3-error); }

    /* Bottom Navigation Bar */
    .bottom-nav {
      flex-shrink: 0;
      width: 100%;
      height: calc(58px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(247, 249, 252, 0.98);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--m3-surface-container);
      z-index: 50;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--m3-text-variant);
      padding: 0;
    }
    .nav-icon-container {
      width: 48px;
      height: 26px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      transition: background-color 0.2s, transform 0.15s;
    }
    .nav-item.active .nav-icon-container {
      background-color: var(--m3-primary-container);
      color: var(--m3-on-primary-container);
    }
    .nav-item.active {
      color: var(--m3-primary);
      font-weight: 600;
    }
    .nav-label {
      font-size: 10.5px;
      line-height: 12px;
    }

    /* Material inputs & forms */
    .m3-input {
      width: 100%;
      background-color: var(--m3-surface-container);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--m3-text-main);
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .m3-input:focus {
      background-color: #FFFFFF;
      border-color: var(--m3-primary);
    }
    .m3-btn {
      width: 100%;
      background-color: var(--m3-primary);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .m3-btn-secondary {
      background-color: var(--m3-surface-container-high);
      color: var(--m3-text-main);
    }
    .form-section {
      padding: 14px;
      background: #FFFFFF;
      border-bottom: 4px solid var(--m3-surface-container);
    }
    .form-section-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--m3-primary);
      margin-bottom: 10px;
    }

    /* Grid Layout variant */
    .module-grid {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 10px;
    }
    .module-grid .contact-item,
    .module-grid .list-item {
      flex-direction: column;
      align-items: flex-start;
      border-radius: 14px;
      border: 1px solid var(--m3-surface-container);
      padding: 12px;
      gap: 8px;
    }
    .module-grid .contact-actions {
      width: 100%;
      justify-content: flex-end;
    }

    /* Auth screen */
    .login-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px;
    }
    .login-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--m3-primary-container);
      color: var(--m3-primary);
      display: grid;
      place-items: center;
      margin-bottom: 20px;
    }

    /* Spinner */
    .loader {
      border: 2px solid transparent;
      border-top: 2px solid currentColor;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- LOGIN VIEW -->
    <div id="loginView" class="view active">
      <div class="login-wrapper">
        <div class="login-icon">
          <i data-lucide="shield-check" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-bold mb-1">Sign in</h1>
        <p class="text-sm text-[var(--m3-text-variant)] mb-6">Authenticate to access CM Contacts</p>
        
        <form id="loginForm">
          <input type="email" id="emailInput" class="m3-input" placeholder="Email" required autocomplete="email">
          <input type="password" id="passwordInput" class="m3-input" placeholder="Password" required autocomplete="current-password">
          <button type="submit" id="loginBtn" class="m3-btn">
            <span id="loginBtnText">Login</span>
            <div class="loader" id="loginLoader"></div>
          </button>
        </form>
        <div id="loginError" class="text-xs text-[var(--m3-error)] mt-3 text-center min-h-[16px]"></div>
      </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="mainAppWrapper" class="view">
      
      <!-- Top Fixed Header -->
      <header class="search-header">
        <div class="search-bar">
          <i data-lucide="search" class="w-5 h-5 text-[var(--m3-text-muted)] flex-shrink-0"></i>
          <input type="text" id="searchInput" placeholder="Search clients, IDs...">
          <button id="logoutBtn" class="border-none bg-transparent p-0 rounded-full flex-shrink-0" title="Logout">
            <span class="w-7 h-7 rounded-full bg-[var(--m3-primary)] text-white text-xs font-semibold grid place-items-center">CM</span>
          </button>
        </div>
      </header>
      
      <!-- CONTACTS VIEW -->
      <div class="sub-view flex-1 flex flex-col min-h-0" id="viewContacts" style="display: flex;">
        <div class="view-toolbar">
          <div class="view-toggle" data-view-toggle="viewContacts">
            <button type="button" class="active" data-layout="list" title="List view">
              <i data-lucide="list" class="w-4 h-4"></i>
            </button>
            <button type="button" data-layout="grid" title="Grid view">
              <i data-lucide="grid-2x2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <main class="content-scroll">
          <div id="contactList"></div>
        </main>
      </div>

      <!-- NOTES VIEW -->
      <div class="sub-view flex-1 flex flex-col min-h-0" id="viewNotes" style="display: none;">
        <div class="view-toolbar">
          <div class="view-toggle" data-view-toggle="viewNotes">
            <button type="button" class="active" data-layout="list"><i data-lucide="list" class="w-4 h-4"></i></button>
            <button type="button" data-layout="grid"><i data-lucide="grid-2x2" class="w-4 h-4"></i></button>
          </div>
        </div>
        <main class="content-scroll">
          <div class="form-section">
            <h2 class="form-section-title">Add Note</h2>
            <form id="noteForm">
              <input type="text" id="noteClient" class="m3-input" placeholder="Search & Select Client" list="clientsDatalist" required autocomplete="off">
              <datalist id="clientsDatalist"></datalist>
              <textarea id="noteText" class="m3-input" placeholder="Note details..." rows="2" required></textarea>
              <input type="datetime-local" id="noteReminder" class="m3-input" required>
              <button type="submit" id="saveNoteBtn" class="m3-btn">
                <span id="noteBtnText">Save Note</span>
                <div class="loader" id="noteLoader"></div>
              </button>
            </form>
          </div>
          <div id="notesList" class="p-2"></div>
        </main>
      </div>

      <!-- MY LINKS VIEW -->
      <div class="sub-view flex-1 flex flex-col min-h-0" id="viewLinks" style="display: none;">
        <div class="view-toolbar">
          <div class="view-toggle" data-view-toggle="viewLinks">
            <button type="button" class="active" data-layout="list"><i data-lucide="list" class="w-4 h-4"></i></button>
            <button type="button" data-layout="grid"><i data-lucide="grid-2x2" class="w-4 h-4"></i></button>
          </div>
        </div>
        <main class="content-scroll">
          <div class="form-section">
            <h2 class="form-section-title" id="linkFormTitle">Add Link</h2>
            <form id="linkForm">
              <input type="hidden" id="linkId">
              <input type="text" id="linkName" class="m3-input" placeholder="Link Name" required>
              <input type="url" id="linkUrl" class="m3-input" placeholder="https://..." required>
              <div class="flex gap-2">
                <button type="button" id="cancelLinkEditBtn" class="m3-btn m3-btn-secondary hidden flex-1">Cancel</button>
                <button type="submit" id="saveLinkBtn" class="m3-btn flex-1">
                  <span id="linkBtnText">Save Link</span>
                  <div class="loader" id="linkLoader"></div>
                </button>
              </div>
            </form>
          </div>
          <div id="linksList" class="p-2"></div>
        </main>
      </div>

      <!-- DATABASE VIEW -->
      <div class="sub-view flex-1 flex flex-col min-h-0" id="viewDatabase" style="display: none;">
        <div class="p-2 bg-[var(--m3-surface)] border-b flex gap-2">
          <input id="databaseCollectionSelect" class="m3-input !mb-0 flex-1 text-sm" list="collectionNames" placeholder="Collection name...">
          <datalist id="collectionNames">
            <option value="clients"></option>
            <option value="notes"></option>
            <option value="links"></option>
            <option value="users"></option>
          </datalist>
          <button id="refreshDatabaseBtn" class="w-10 h-10 rounded-xl bg-[var(--m3-primary-container)] text-[var(--m3-on-primary-container)] grid place-items-center">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="databaseInfo" class="px-3 py-1.5 text-xs text-[var(--m3-text-muted)]"></div>
        <main class="content-scroll p-2">
          <div id="databaseList"></div>
        </main>
      </div>

      <!-- USERS VIEW -->
      <div class="sub-view flex-1 flex flex-col min-h-0" id="viewUsers" style="display: none;">
        <div class="p-3 bg-[var(--m3-surface)] border-b flex justify-between items-center">
          <div>
            <div class="font-semibold text-sm">Users</div>
            <div class="text-xs text-[var(--m3-text-muted)]">Firestore <code>users</code></div>
          </div>
          <button id="refreshUsersBtn" class="w-10 h-10 rounded-xl bg-[var(--m3-primary-container)] text-[var(--m3-on-primary-container)] grid place-items-center">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="usersInfo" class="px-3 py-1.5 text-xs text-[var(--m3-text-muted)]"></div>
        <main class="content-scroll p-2">
          <div id="usersList"></div>
        </main>
      </div>

      <!-- Bottom Nav Pinned at Bottom -->
      <nav class="bottom-nav">
        <button class="nav-item active" data-target="viewContacts">
          <div class="nav-icon-container"><i data-lucide="users" class="w-5 h-5"></i></div>
          <span class="nav-label">Contacts</span>
        </button>
        <button class="nav-item" data-target="viewNotes">
          <div class="nav-icon-container"><i data-lucide="file-text" class="w-5 h-5"></i></div>
          <span class="nav-label">Notes</span>
        </button>
        <button class="nav-item" data-target="viewLinks">
          <div class="nav-icon-container"><i data-lucide="link" class="w-5 h-5"></i></div>
          <span class="nav-label">Links</span>
        </button>
        <button class="nav-item" data-target="viewDatabase">
          <div class="nav-icon-container"><i data-lucide="database" class="w-5 h-5"></i></div>
          <span class="nav-label">Database</span>
        </button>
        <button class="nav-item" data-target="viewUsers">
          <div class="nav-icon-container"><i data-lucide="user-cog" class="w-5 h-5"></i></div>
          <span class="nav-label">Users</span>
        </button>
      </nav>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, getDoc, addDoc, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCXyKSTlmlzkYnH2LW408cVVWV1CPvlfBo",
      authDomain: "cmfilings-6a37c.firebaseapp.com",
      projectId: "cmfilings-6a37c",
      storageBucket: "cmfilings-6a37c.firebasestorage.app",
      messagingSenderId: "138705123778",
      appId: "1:138705123778:web:9561bff9f0f5d89bb6fe5b",
      measurementId: "G-09DM4NZF8D"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let clients = [];
    let notes = [];
    let links = [];
    let currentView = 'viewContacts';

    lucide.createIcons();

    const loginView = document.getElementById("loginView");
    const mainAppWrapper = document.getElementById("mainAppWrapper");
    const loginForm = document.getElementById("loginForm");
    const searchInput = document.getElementById("searchInput");
    const logoutBtn = document.getElementById("logoutBtn");
    const noteForm = document.getElementById("noteForm");
    const clientsDatalist = document.getElementById("clientsDatalist");
    const linkForm = document.getElementById("linkForm");
    const linkIdInput = document.getElementById("linkId");
    const linkNameInput = document.getElementById("linkName");
    const linkUrlInput = document.getElementById("linkUrl");
    const linkFormTitle = document.getElementById("linkFormTitle");
    const cancelLinkEditBtn = document.getElementById("cancelLinkEditBtn");
    const databaseCollectionSelect = document.getElementById("databaseCollectionSelect");
    const refreshDatabaseBtn = document.getElementById("refreshDatabaseBtn");
    const databaseInfo = document.getElementById("databaseInfo");
    const databaseList = document.getElementById("databaseList");
    const refreshUsersBtn = document.getElementById("refreshUsersBtn");
    const usersInfo = document.getElementById("usersInfo");
    const usersList = document.getElementById("usersList");

    const moduleLayouts = {
      viewContacts: 'list',
      viewNotes: 'list',
      viewLinks: 'list',
      viewDatabase: 'list',
      viewUsers: 'list'
    };

    function applyModuleLayout(viewId) {
      const targetMap = {
        viewContacts: 'contactList',
        viewNotes: 'notesList',
        viewLinks: 'linksList',
        viewDatabase: 'databaseList',
        viewUsers: 'usersList'
      };
      const target = document.getElementById(targetMap[viewId]);
      if (target) target.classList.toggle('module-grid', moduleLayouts[viewId] === 'grid');

      document.querySelectorAll(`[data-view-toggle="${viewId}"] button`).forEach(btn => {
        btn.classList.toggle('active', btn.dataset.layout === moduleLayouts[viewId]);
      });
    }

    document.querySelectorAll('[data-view-toggle] button').forEach(btn => {
      btn.addEventListener('click', () => {
        const viewId = btn.closest('[data-view-toggle]').dataset.viewToggle;
        moduleLayouts[viewId] = btn.dataset.layout;
        applyModuleLayout(viewId);
      });
    });

    function showMainView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function switchSubView(targetId) {
      currentView = targetId;
      document.querySelectorAll('.sub-view').forEach(v => v.style.display = 'none');
      document.getElementById(targetId).style.display = 'flex';
      
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.target === targetId);
      });
      
      searchInput.value = "";
      if (targetId === 'viewContacts') searchInput.placeholder = "Search clients, IDs...";
      else if (targetId === 'viewNotes') searchInput.placeholder = "Search notes, clients...";
      else if (targetId === 'viewLinks') searchInput.placeholder = "Search links...";
      else searchInput.placeholder = "Search...";
      
      renderCurrentView();
    }

    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.addEventListener("click", () => switchSubView(btn.dataset.target));
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        showMainView("mainAppWrapper");
        fetchAllData();
      } else {
        showMainView("loginView");
        clients = []; notes = []; links = [];
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("emailInput").value;
      const password = document.getElementById("passwordInput").value;
      const loginBtn = document.getElementById("loginBtn");
      const loginBtnText = document.getElementById("loginBtnText");
      const loginLoader = document.getElementById("loginLoader");
      const loginError = document.getElementById("loginError");
      
      loginError.textContent = "";
      loginBtn.disabled = true;
      loginBtnText.style.display = 'none';
      loginLoader.style.display = 'block';

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        loginError.textContent = "Authentication failed. Check your credentials.";
      } finally {
        loginBtn.disabled = false;
        loginBtnText.style.display = 'block';
        loginLoader.style.display = 'none';
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    async function fetchAllData() {
      const loaderHtml = `<div class="flex justify-center items-center h-36 text-[var(--m3-primary)]"><div class="animate-spin rounded-full h-7 w-7 border-b-2 border-current"></div></div>`;
      document.getElementById("contactList").innerHTML = loaderHtml;
      document.getElementById("notesList").innerHTML = loaderHtml;
      document.getElementById("linksList").innerHTML = loaderHtml;

      try {
        const clientsSnap = await getDocs(collection(db, "clients"));
        clients = [];
        clientsSnap.forEach(d => {
          const val = d.data();
          clients.push({
            docId: d.id,
            id: val.clientId || d.id,
            name: val.clientName || 'Unknown Name',
            mobile: val.mobile || '',
          });
        });
        clients.sort((a, b) => a.name.localeCompare(b.name));
        populateClientsDatalist();

        const notesSnap = await getDocs(collection(db, "notes"));
        notes = [];
        notesSnap.forEach(d => notes.push({ docId: d.id, ...d.data() }));
        notes.sort((a, b) => new Date(a.reminderDate) - new Date(b.reminderDate));

        const linksSnap = await getDocs(collection(db, "links"));
        links = [];
        linksSnap.forEach(d => links.push({ docId: d.id, ...d.data() }));
        links.sort((a, b) => a.name.localeCompare(b.name));

        renderCurrentView();
      } catch (error) {
        document.getElementById("contactList").innerHTML = `<div class="text-center p-4 text-[var(--m3-error)]">Failed to load data.</div>`;
      }
    }

    function populateClientsDatalist() {
      clientsDatalist.innerHTML = "";
      clients.forEach(c => {
        const opt = document.createElement("option");
        opt.value = `${c.name} (${c.id})`;
        clientsDatalist.appendChild(opt);
      });
    }

    searchInput.addEventListener("input", (e) => renderCurrentView(e.target.value));

    function renderCurrentView(query = searchInput.value) {
      if (currentView === 'viewContacts') renderContacts(query);
      else if (currentView === 'viewNotes') renderNotes(query);
      else if (currentView === 'viewLinks') renderLinks(query);
    }

    function getInitials(name) { return name ? name.substring(0, 1).toUpperCase() : "?"; }
    function formatWhatsApp(mobile) {
      if (!mobile) return "";
      let num = mobile.replace(/\D/g, '');
      if (num.length === 10) num = "91" + num; 
      return `https://wa.me/${num}`;
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    function renderContacts(query = "") {
      const listContainer = document.getElementById("contactList");
      listContainer.innerHTML = "";

      const filtered = clients.filter(c =>
        (c.name && c.name.toLowerCase().includes(query.toLowerCase())) ||
        (c.id && c.id.toLowerCase().includes(query.toLowerCase())) ||
        (c.mobile && c.mobile.includes(query))
      );

      if (!filtered.length) {
        listContainer.innerHTML = `<div class="flex flex-col items-center justify-center h-40 text-[var(--m3-text-muted)]"><i data-lucide="search-x" class="w-8 h-8 mb-2"></i><p class="text-sm">No clients found.</p></div>`;
        lucide.createIcons();
        return;
      }

      filtered.forEach(client => {
        const mobile = client.mobile || "";
        const clientDataStr = JSON.stringify(client).replace(/'/g, "&#39;");
        const html = `
          <div class="contact-item">
            <div class="avatar">${getInitials(client.name)}</div>
            <div class="contact-main">
              <div class="contact-name">${escapeHtml(client.name)}</div>
              <div class="contact-id">ID: ${escapeHtml(client.id)}</div>
            </div>
            <div class="contact-actions">
              <button type="button" class="action-btn action-save" title="Contact Card" onclick='openPhoneContact(${clientDataStr})'>
                <i data-lucide="contact-round" class="w-4 h-4"></i>
              </button>
              <a href="${formatWhatsApp(mobile)}" target="_blank" rel="noopener noreferrer" class="action-btn action-whatsapp" title="WhatsApp">
                <i data-lucide="message-circle" class="w-4 h-4"></i>
              </a>
              <a href="tel:${encodeURIComponent(mobile)}" class="action-btn action-call" title="Call">
                <i data-lucide="phone" class="w-4 h-4"></i>
              </a>
            </div>
          </div>
        `;
        listContainer.insertAdjacentHTML('beforeend', html);
      });

      lucide.createIcons();
      applyModuleLayout('viewContacts');
    }

    window.openPhoneContact = async (client) => {
      const name = client?.name || "CM Client";
      const mobile = client?.mobile || "";
      const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name.replace(/[,;\\]/g, " ")}\nTEL;TYPE=CELL:${mobile}\nNOTE:CM Client ID ${client?.id || ""}\nEND:VCARD\n`;

      try {
        const file = new File([vcard], `${name.replace(/[^a-z0-9]/gi, "_")}.vcf`, {type: "text/vcard"});
        if (navigator.share && navigator.canShare && navigator.canShare({files: [file]})) {
          await navigator.share({files: [file], title: name});
          return;
        }
      } catch (err) {}

      const blob = new Blob([vcard], {type: "text/vcard"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${name.replace(/[^a-z0-9]/gi, "_")}.vcf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    function renderNotes(query = "") {
      const listContainer = document.getElementById("notesList");
      listContainer.innerHTML = "";
      
      const filtered = notes.filter(n => 
        (n.clientRef && n.clientRef.toLowerCase().includes(query.toLowerCase())) || 
        (n.text && n.text.toLowerCase().includes(query.toLowerCase()))
      );

      if (!filtered.length) {
        listContainer.innerHTML = `<div class="text-center p-6 text-sm text-[var(--m3-text-muted)]">No notes recorded.</div>`;
        return;
      }

      filtered.forEach(note => {
        const d = new Date(note.reminderDate);
        const html = `
          <div class="contact-item !flex-col !items-start gap-1 rounded-xl mb-2">
            <div class="flex justify-between w-full">
              <span class="font-semibold text-sm text-[var(--m3-primary)]">${escapeHtml(note.clientRef)}</span>
              <span class="text-[11px] text-[var(--m3-text-muted)]">${d.toLocaleString()}</span>
            </div>
            <p class="text-xs text-[var(--m3-text-main)]">${escapeHtml(note.text)}</p>
          </div>
        `;
        listContainer.insertAdjacentHTML('beforeend', html);
      });
      lucide.createIcons();
      applyModuleLayout('viewNotes');
    }

    noteForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("saveNoteBtn");
      const loader = document.getElementById("noteLoader");
      const txt = document.getElementById("noteBtnText");
      btn.disabled = true; txt.style.display = 'none'; loader.style.display = 'block';

      try {
        const newNote = {
          clientRef: document.getElementById("noteClient").value,
          text: document.getElementById("noteText").value,
          reminderDate: document.getElementById("noteReminder").value,
          createdAt: new Date().toISOString()
        };
        const docRef = await addDoc(collection(db, "notes"), newNote);
        notes.push({ docId: docRef.id, ...newNote });
        noteForm.reset();
        renderNotes();
      } catch (err) {
        alert("Failed to save note.");
      } finally {
        btn.disabled = false; txt.style.display = 'block'; loader.style.display = 'none';
      }
    });

    function renderLinks(query = "") {
      const listContainer = document.getElementById("linksList");
      listContainer.innerHTML = "";
      
      const filtered = links.filter(l => 
        (l.name && l.name.toLowerCase().includes(query.toLowerCase())) || 
        (l.url && l.url.toLowerCase().includes(query.toLowerCase()))
      );

      if (!filtered.length) {
        listContainer.innerHTML = `<div class="text-center p-6 text-sm text-[var(--m3-text-muted)]">No links available.</div>`;
        return;
      }

      filtered.forEach(link => {
        const html = `
          <div class="contact-item rounded-xl mb-2">
            <div class="avatar"><i data-lucide="link" class="w-4 h-4"></i></div>
            <div class="contact-main">
              <div class="contact-name">${escapeHtml(link.name)}</div>
              <div class="contact-id truncate"><a href="${link.url}" target="_blank" class="text-[var(--m3-primary)]">${link.url}</a></div>
            </div>
            <div class="contact-actions">
              <a href="${link.url}" target="_blank" class="action-btn action-call"><i data-lucide="external-link" class="w-4 h-4"></i></a>
              <button class="action-btn action-danger" onclick="deleteLink('${link.docId}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </div>
        `;
        listContainer.insertAdjacentHTML('beforeend', html);
      });
      lucide.createIcons();
      applyModuleLayout('viewLinks');
    }

    linkForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("saveLinkBtn");
      const loader = document.getElementById("linkLoader");
      const txt = document.getElementById("linkBtnText");
      btn.disabled = true; txt.style.display = 'none'; loader.style.display = 'block';

      try {
        const data = {
          name: linkNameInput.value,
          url: linkUrlInput.value,
          createdAt: new Date().toISOString()
        };
        const docRef = await addDoc(collection(db, "links"), data);
        links.push({ docId: docRef.id, ...data });
        linkForm.reset();
        renderLinks();
      } catch (err) {
        alert("Failed to save link.");
      } finally {
        btn.disabled = false; txt.style.display = 'block'; loader.style.display = 'none';
      }
    });

    window.deleteLink = async (docId) => {
      if (confirm("Delete this link?")) {
        await deleteDoc(doc(db, "links", docId));
        links = links.filter(l => l.docId !== docId);
        renderLinks();
      }
    };

    // Generic DB Collection Loader
    async function loadDatabaseCollection(colName) {
      if (!colName) return;
      databaseList.innerHTML = `<div class="text-center p-4 text-xs text-[var(--m3-text-muted)]">Loading...</div>`;
      try {
        const snap = await getDocs(collection(db, colName));
        databaseInfo.textContent = `${snap.size} documents found`;
        if (snap.empty) {
          databaseList.innerHTML = `<div class="text-center p-4 text-xs text-[var(--m3-text-muted)]">No documents in this collection.</div>`;
          return;
        }
        let cards = "";
        snap.forEach(d => {
          cards += `
            <div class="bg-white p-3 rounded-xl border border-[var(--m3-surface-container)] mb-2 text-xs">
              <div class="font-bold text-[var(--m3-primary)] mb-1">${escapeHtml(d.id)}</div>
              <pre class="overflow-x-auto whitespace-pre-wrap font-mono text-[11px] text-[var(--m3-text-variant)]">${escapeHtml(JSON.stringify(d.data(), null, 2))}</pre>
            </div>
          `;
        });
        databaseList.innerHTML = cards;
      } catch (e) {
        databaseList.innerHTML = `<div class="text-center p-4 text-xs text-[var(--m3-error)]">Failed to load collection.</div>`;
      }
    }

    refreshDatabaseBtn.addEventListener("click", () => {
      loadDatabaseCollection(databaseCollectionSelect.value.trim());
    });

    // Users Loader
    async function loadUsers() {
      usersList.innerHTML = `<div class="text-center p-4 text-xs text-[var(--m3-text-muted)]">Loading users...</div>`;
      try {
        const snap = await getDocs(collection(db, "users"));
        usersInfo.textContent = `${snap.size} users found`;
        if (snap.empty) {
          usersList.innerHTML = `<div class="text-center p-4 text-xs text-[var(--m3-text-muted)]">No documents in "users" collection.</div>`;
          return;
        }
        let cards = "";
        snap.forEach(d => {
          cards += `
            <div class="bg-white p-3 rounded-xl border border-[var(--m3-surface-container)] mb-2 text-xs">
              <div class="font-bold text-[var(--m3-primary)] mb-1">${escapeHtml(d.id)}</div>
              <pre class="overflow-x-auto whitespace-pre-wrap font-mono text-[11px] text-[var(--m3-text-variant)]">${escapeHtml(JSON.stringify(d.data(), null, 2))}</pre>
            </div>
          `;
        });
        usersList.innerHTML = cards;
      } catch (e) {
        usersList.innerHTML = `<div class="text-center p-4 text-xs text-[var(--m3-error)]">Failed to load users.</div>`;
      }
    }

    refreshUsersBtn.addEventListener("click", loadUsers);
  </script>
</body>
