<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>COREBIQ - Credentials</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="./style.css">
  <style>
    :root {
      --m3-primary: #0b57d0;
      --m3-surface: #F7F9FC;
      --m3-surface-container: #E9EEF6;
      --m3-text-main: #1F1F1F;
      --m3-text-muted: #5E5E5E;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--m3-surface);
      color: var(--m3-text-main);
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-24">

  <!-- TOP SUMMARY BAR -->
  <div class="px-4 pt-3 pb-2 grid grid-cols-3 gap-2">
    <div class="bg-white p-3 rounded-2xl border border-[var(--m3-surface-container)] shadow-sm">
      <span class="text-[11px] text-[var(--m3-text-muted)] font-medium block">Total Saved</span>
      <span id="statTotal" class="text-lg font-bold text-[var(--m3-primary)]">0</span>
    </div>
    <div class="bg-white p-3 rounded-2xl border border-[var(--m3-surface-container)] shadow-sm">
      <span class="text-[11px] text-[var(--m3-text-muted)] font-medium block">Portals</span>
      <span id="statPortals" class="text-lg font-bold text-indigo-600">0</span>
    </div>
    <div class="bg-white p-3 rounded-2xl border border-[var(--m3-surface-container)] shadow-sm">
      <span class="text-[11px] text-[var(--m3-text-muted)] font-medium block">Clients Linked</span>
      <span id="statClients" class="text-lg font-bold text-emerald-600">0</span>
    </div>
  </div>

  <!-- SEARCH & FILTER TOOLBAR -->
  <div class="px-4 py-2 sticky top-0 bg-[var(--m3-surface)] z-20">
    <div class="flex gap-2 items-center mb-2">
      <div class="flex-1 bg-white rounded-full px-3.5 py-2.5 flex items-center gap-2 border border-[var(--m3-surface-container)] shadow-sm">
        <i data-lucide="search" class="w-4 h-4 text-[var(--m3-text-muted)]"></i>
        <input type="text" id="searchInput" placeholder="Search client, portal, username, CR ID..." class="w-full bg-transparent border-none outline-none text-sm">
      </div>
      <button id="openModalBtn" class="h-10 px-4 rounded-full bg-[var(--m3-primary)] text-white text-sm font-medium flex items-center gap-1.5 shadow-sm shrink-0">
        <i data-lucide="plus" class="w-4 h-4"></i> New
      </button>
    </div>

    <!-- Portal Filter Pills -->
    <div id="portalFilters" class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5">
      <button data-filter="All" class="filter-pill active px-3 py-1 rounded-full text-xs font-medium bg-[var(--m3-primary)] text-white shrink-0">All</button>
      <button data-filter="Income Tax" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-white text-[var(--m3-text-muted)] border border-[var(--m3-surface-container)] shrink-0">Income Tax</button>
      <button data-filter="GST" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-white text-[var(--m3-text-muted)] border border-[var(--m3-surface-container)] shrink-0">GST</button>
      <button data-filter="MCA" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-white text-[var(--m3-text-muted)] border border-[var(--m3-surface-container)] shrink-0">MCA</button>
      <button data-filter="TRACES" class="filter-pill px-3 py-1 rounded-full text-xs font-medium bg-white text-[var(--m3-text-muted)] border border-[var(--m3-surface-container)] shrink-0">TRACES</button>
    </div>
  </div>

  <!-- CREDENTIALS LIST -->
  <div id="credentialsList" class="px-4 mt-2 flex flex-col gap-2.5">
    <div class="text-center py-12 text-sm text-[var(--m3-text-muted)]">Loading credentials...</div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50">
    Copied to clipboard
  </div>

  <!-- ADD / EDIT CREDENTIAL MODAL -->
  <div id="credentialModal" class="fixed inset-0 bg-black/50 z-50 hidden items-end justify-center">
    <div class="bg-white w-full max-w-[412px] rounded-t-3xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-lg font-semibold">Add Credential</h3>
        <button type="button" id="closeModalBtn" class="p-1.5 rounded-full bg-gray-100 hover:bg-gray-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="credentialForm" class="flex flex-col gap-3">
        <input type="hidden" id="isEditMode" value="false">

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-medium text-gray-500 ml-1">Credential ID</label>
            <input type="text" id="credentialID" class="w-full mt-1 p-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm font-medium" required readonly>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-500 ml-1">Client ID</label>
            <input type="text" id="clientId" placeholder="e.g. C40001" class="w-full mt-1 p-2.5 rounded-xl bg-gray-50 border border-gray-200 text-sm" required>
          </div>
        </div>

        <div>
          <label class="text-xs font-medium text-gray-500 ml-1">Client Name</label>
          <input type="text" id="clientName" list="clientsDatalist" placeholder="Search or type client name..." class="w-full mt-1 p-2.5 rounded-xl bg-gray-50 border border-gray-200 text-sm" required>
          <datalist id="clientsDatalist"></datalist>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="text-xs font-medium text-gray-500 ml-1">Portal Name</label>
            <input type="text" id="portalName" list="portalSuggestions" placeholder="e.g. Income Tax Portal" class="w-full mt-1 p-2.5 rounded-xl bg-gray-50 border border-gray-200 text-sm" required>
            <datalist id="portalSuggestions">
              <option value="Income Tax Portal">
              <option value="GST Portal">
              <option value="MCA Portal">
              <option value="TRACES">
              <option value="EPFO / ESIC">
              <option value="DGFT">
            </datalist>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-500 ml-1">Portal No</label>
            <input type="text" id="portalNo" placeholder="e.g. 32" class="w-full mt-1 p-2.5 rounded-xl bg-gray-50 border border-gray-200 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-medium text-gray-500 ml-1">Username / User ID</label>
            <input type="text" id="userName" placeholder="Enter username" class="w-full mt-1 p-2.5 rounded-xl bg-gray-50 border border-gray-200 text-sm" required autocomplete="off">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-500 ml-1">Password</label>
            <div class="relative mt-1">
              <input type="text" id="password" placeholder="Enter password" class="w-full p-2.5 rounded-xl bg-gray-50 border border-gray-200 text-sm" required autocomplete="off">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-medium text-gray-500 ml-1">Created By</label>
            <input type="text" id="createdBy" placeholder="Email or Admin" class="w-full mt-1 p-2.5 rounded-xl bg-gray-50 border border-gray-200 text-sm" required>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-500 ml-1">Narration / Notes</label>
            <input type="text" id="narration" placeholder="Optional remarks..." class="w-full mt-1 p-2.5 rounded-xl bg-gray-50 border border-gray-200 text-sm">
          </div>
        </div>

        <button type="submit" id="saveCredentialBtn" class="w-full py-3 mt-2 rounded-xl bg-[var(--m3-primary)] text-white font-semibold text-sm shadow-md">
          Save Credential
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let currentUserEmail = "Admin";

    // Automatically extracts Firebase config from ./app.js
    async function initFirebaseFromAppJs() {
      let app;
      if (getApps().length > 0) {
        app = getApps()[0];
      } else {
        const res = await fetch('./app.js');
        const code = await res.text();
        const apiKey = code.match(/apiKey\s*:\s*["']([^"']+)["']/)?.[1];
        const authDomain = code.match(/authDomain\s*:\s*["']([^"']+)["']/)?.[1];
        const projectId = code.match(/projectId\s*:\s*["']([^"']+)["']/)?.[1];
        const storageBucket = code.match(/storageBucket\s*:\s*["']([^"']+)["']/)?.[1];
        const messagingSenderId = code.match(/messagingSenderId\s*:\s*["']([^"']+)["']/)?.[1];
        const appId = code.match(/appId\s*:\s*["']([^"']+)["']/)?.[1];
        app = initializeApp({ apiKey, authDomain, projectId, storageBucket, messagingSenderId, appId });
      }

      try {
        const auth = getAuth(app);
        onAuthStateChanged(auth, (user) => {
          if (user && user.email) currentUserEmail = user.email;
        });
      } catch (e) {}

      return getFirestore(app);
    }

    let db;
    let allCredentials = [];
    let clientsMap = new Map();
    let activeFilter = "All";
    const visiblePasswords = new Set();

    const listEl = document.getElementById('credentialsList');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('credentialModal');
    const form = document.getElementById('credentialForm');

    // Generate next Credential ID matching CR-0001 pattern
    function generateNextCredentialId() {
      let maxSeq = 0;
      allCredentials.forEach(item => {
        const id = item.credentialID || item.id || "";
        const match = id.match(/^CR-(\d+)$/i);
        if (match) {
          const seq = parseInt(match[1], 10);
          if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
        }
      });
      return `CR-${String(maxSeq + 1).padStart(4, '0')}`;
    }

    // Load Clients from 'clients' collection for auto-complete
    async function loadClients() {
      try {
        const snap = await getDocs(collection(db, "clients"));
        const datalist = document.getElementById('clientsDatalist');
        datalist.innerHTML = '';
        snap.forEach(d => {
          const data = d.data();
          const name = data.name || data.clientName || "";
          const cId = data.clientId || data.id || d.id;
          if (name) {
            clientsMap.set(name.toLowerCase(), cId);
            const opt = document.createElement('option');
            opt.value = name;
            opt.label = cId;
            datalist.appendChild(opt);
          }
        });
      } catch (e) {
        console.warn("Clients lookup optional:", e);
      }
    }

    // Auto-fill clientId when clientName is selected
    document.getElementById('clientName').addEventListener('input', (e) => {
      const val = e.target.value.trim().toLowerCase();
      if (clientsMap.has(val)) {
        document.getElementById('clientId').value = clientsMap.get(val);
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 1800);
    }

    window.copyText = (text, label) => {
      navigator.clipboard.writeText(text || '');
      showToast(`${label} copied!`);
    };

    window.togglePassword = (id) => {
      if (visiblePasswords.has(id)) visiblePasswords.delete(id);
      else visiblePasswords.add(id);
      renderList();
    };

    function updateSummary() {
      const portals = new Set();
      const clients = new Set();
      allCredentials.forEach(c => {
        if (c.portalName) portals.add(c.portalName.trim().toLowerCase());
        if (c.clientId) clients.add(c.clientId.trim().toUpperCase());
      });
      document.getElementById('statTotal').textContent = allCredentials.length;
      document.getElementById('statPortals').textContent = portals.size;
      document.getElementById('statClients').textContent = clients.size;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderList() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = allCredentials.filter(item => {
        const matchesSearch = !q ||
          (item.clientName || "").toLowerCase().includes(q) ||
          (item.clientId || "").toLowerCase().includes(q) ||
          (item.credentialID || "").toLowerCase().includes(q) ||
          (item.portalName || "").toLowerCase().includes(q) ||
          (item.userName || "").toLowerCase().includes(q);

        const matchesFilter =
          activeFilter === "All" ||
          (item.portalName || "").toLowerCase().includes(activeFilter.toLowerCase());

        return matchesSearch && matchesFilter;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="text-center py-12 text-sm text-[var(--m3-text-muted)]">No credentials found.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => {
        const docId = item.credentialID || item.id;
        const isShown = visiblePasswords.has(docId);
        const maskedPwd = item.password ? '•'.repeat(Math.min(item.password.length, 10)) : '—';

        return `
          <div class="bg-white p-4 rounded-2xl border border-[var(--m3-surface-container)] shadow-sm flex flex-col gap-2.5">
            <div class="flex justify-between items-start gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 mb-0.5">
                  <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-blue-50 text-[var(--m3-primary)]">${escapeHtml(docId)}</span>
                  <span class="text-[11px] text-gray-500 font-medium">${escapeHtml(item.clientId)}</span>
                  ${item.portalNo ? `<span class="text-[11px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-600 font-medium">#${escapeHtml(item.portalNo)}</span>` : ''}
                </div>
                <h4 class="font-semibold text-sm text-[var(--m3-text-main)] truncate">${escapeHtml(item.clientName || 'Unnamed Client')}</h4>
              </div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100 shrink-0">
                ${escapeHtml(item.portalName || 'Portal')}
              </span>
            </div>

            <!-- Username & Password Box -->
            <div class="bg-[var(--m3-surface)] p-2.5 rounded-xl border border-[var(--m3-surface-container)] flex flex-col gap-1.5 text-xs">
              <div class="flex items-center justify-between gap-2">
                <div class="truncate">
                  <span class="text-gray-400 font-medium mr-1">User:</span>
                  <span class="font-semibold text-gray-800 select-all">${escapeHtml(item.userName || '-')}</span>
                </div>
                <button type="button" onclick="window.copyText('${escapeHtml(item.userName)}', 'Username')" class="px-2 py-1 rounded-md bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 font-medium shrink-0">
                  Copy ID
                </button>
              </div>

              <div class="flex items-center justify-between gap-2 pt-1 border-t border-gray-200/60">
                <div class="truncate">
                  <span class="text-gray-400 font-medium mr-1">Pass:</span>
                  <span class="font-mono font-semibold text-gray-800">${isShown ? escapeHtml(item.password) : maskedPwd}</span>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button type="button" onclick="window.togglePassword('${escapeHtml(docId)}')" class="px-2 py-1 rounded-md bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 font-medium">
                    ${isShown ? 'Hide' : 'Show'}
                  </button>
                  <button type="button" onclick="window.copyText('${escapeHtml(item.password)}', 'Password')" class="px-2 py-1 rounded-md bg-[var(--m3-primary)] text-white font-medium">
                    Copy Pass
                  </button>
                </div>
              </div>
            </div>

            ${item.narration ? `<p class="text-xs text-gray-500 bg-gray-50 px-2.5 py-1.5 rounded-lg">${escapeHtml(item.narration)}</p>` : ''}

            <div class="flex items-center justify-between pt-1 text-xs">
              <span class="text-[11px] text-gray-400 truncate">By: ${escapeHtml(item.createdBy || 'Admin')}</span>
              <div class="flex gap-2">
                <button type="button" onclick="window.editCredential('${escapeHtml(docId)}')" class="text-xs font-medium text-blue-600 px-2.5 py-1 rounded-lg hover:bg-blue-50">Edit</button>
                <button type="button" onclick="window.deleteCredential('${escapeHtml(docId)}')" class="text-xs font-medium text-rose-600 px-2.5 py-1 rounded-lg hover:bg-rose-50">Delete</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Modal Controls
    document.getElementById('openModalBtn').addEventListener('click', () => {
      form.reset();
      document.getElementById('isEditMode').value = "false";
      document.getElementById('modalTitle').textContent = "Add Credential";
      document.getElementById('credentialID').value = generateNextCredentialId();
      document.getElementById('createdBy').value = currentUserEmail;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    // Edit Credential
    window.editCredential = (id) => {
      const item = allCredentials.find(c => (c.credentialID || c.id) === id);
      if (!item) return;
      document.getElementById('isEditMode').value = "true";
      document.getElementById('modalTitle').textContent = "Edit Credential";
      document.getElementById('credentialID').value = item.credentialID || item.id;
      document.getElementById('clientId').value = item.clientId || "";
      document.getElementById('clientName').value = item.clientName || "";
      document.getElementById('portalName').value = item.portalName || "";
      document.getElementById('portalNo').value = item.portalNo || "";
      document.getElementById('userName').value = item.userName || "";
      document.getElementById('password').value = item.password || "";
      document.getElementById('createdBy').value = item.createdBy || currentUserEmail;
      document.getElementById('narration').value = item.narration || "";
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    // Delete Credential
    window.deleteCredential = async (id) => {
      if (!confirm(`Delete credential ${id}?`)) return;
      await deleteDoc(doc(db, "credentials", id));
    };

    // Save Credential matching exact Firestore schema
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveCredentialBtn');
      btn.disabled = true;
      btn.textContent = "Saving...";

      try {
        const credId = document.getElementById('credentialID').value.trim();
        const isEdit = document.getElementById('isEditMode').value === "true";
        const existing = allCredentials.find(c => (c.credentialID || c.id) === credId);
        const nowIso = new Date().toISOString();

        const payload = {
          clientId: document.getElementById('clientId').value.trim(),
          clientName: document.getElementById('clientName').value.trim(),
          createdAt: isEdit && existing?.createdAt ? existing.createdAt : nowIso,
          createdBy: document.getElementById('createdBy').value.trim() || currentUserEmail,
          credentialID: credId,
          narration: document.getElementById('narration').value.trim(),
          password: document.getElementById('password').value,
          portalName: document.getElementById('portalName').value.trim(),
          portalNo: String(document.getElementById('portalNo').value.trim()),
          updatedAt: nowIso,
          userName: document.getElementById('userName').value.trim()
        };

        await setDoc(doc(db, "credentials", credId), payload, { merge: true });
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      } catch (err) {
        alert("Failed to save: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Save Credential";
      }
    });

    // Search & Filter Listeners
    searchInput.addEventListener('input', renderList);
    document.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach(b => {
          b.className = "filter-pill px-3 py-1 rounded-full text-xs font-medium bg-white text-[var(--m3-text-muted)] border border-[var(--m3-surface-container)] shrink-0";
        });
        btn.className = "filter-pill active px-3 py-1 rounded-full text-xs font-medium bg-[var(--m3-primary)] text-white shrink-0";
        activeFilter = btn.getAttribute('data-filter');
        renderList();
      });
    });

    // Initialize Module
    (async () => {
      if (window.lucide) lucide.createIcons();
      try {
        db = await initFirebaseFromAppJs();
        loadClients();
        onSnapshot(collection(db, "credentials"), (snapshot) => {
          allCredentials = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          allCredentials.sort((a, b) => (b.credentialID || b.id).localeCompare(a.credentialID || a.id));
          updateSummary();
          renderList();
        });
      } catch (err) {
        listEl.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-xl text-xs">Error connecting to Firestore: ${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
