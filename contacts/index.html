<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#F7F9FC"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CM Contacts"><title>CM Contacts</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.svg"><link rel="apple-touch-icon" href="./icon-192.svg"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script><link rel="stylesheet" href="./style.css"></head><body><div class="app-container"><div id="loginView" class="view active"><div class="login-wrapper"><div class="login-icon"><i data-lucide="shield-check" class="w-8 h-8"></i></div><h1 class="login-title">CM Contacts</h1><p class="login-subtitle">Sign in to access workspace</p><form id="loginForm"><input type="email" id="emailInput" class="m3-input" placeholder="Email" required autocomplete="email"><div class="password-wrapper"><input type="password" id="passwordInput" class="m3-input" placeholder="Password" required autocomplete="current-password"><button type="button" id="togglePwdBtn" class="toggle-pwd-btn" tabindex="-1" title="Toggle Password"><i data-lucide="eye" id="pwdIcon" class="w-5 h-5"></i></button></div><button type="submit" id="loginBtn" class="m3-btn"><span id="loginBtnText">Login</span><div class="loader" id="loginLoader"></div></button></form><div id="loginError" class="error-msg"></div></div></div><div id="appView" class="view"><div id="tab-contacts" class="tab-content active"><header class="search-header"><div class="search-bar"><i data-lucide="search" class="w-5 h-5 text-[var(--m3-text-variant)]"></i><input type="text" id="searchInput" placeholder="Search clients, IDs..."><button id="importContactsBtn" class="import-btn" title="Import from Phone"><i data-lucide="book-user" class="w-[22px] h-[22px]"></i></button><button id="logoutBtn" class="border-none bg-transparent p-0 rounded-full cursor-pointer" title="Logout"><span class="w-8 h-8 rounded-full bg-[var(--m3-primary)] text-white text-xs font-semibold grid place-items-center shadow-sm">CM</span></button></div><div class="toolbar-row"><span class="text-xs text-[var(--m3-text-muted)]">Sort</span><select id="sortSelect" class="sort-select" aria-label="Sort contacts"><option value="name">Name</option><option value="id">ID</option></select></div></header><main class="scroll-area" id="contactList"></main></div><div id="tab-notes" class="tab-content bg-[var(--m3-surface)]"><header class="search-header flex items-center justify-between"><h2 class="text-xl font-semibold text-[var(--m3-text-main)]">Notes</h2></header><main class="scroll-area px-4"><form id="noteForm" class="bg-white p-4 rounded-2xl shadow-sm mb-6 border border-[var(--m3-surface-container)]"><input type="text" list="clientDatalist" id="noteClient" class="m3-input !mb-3 !p-3" placeholder="Select Client..." required><datalist id="clientDatalist"></datalist><textarea id="noteContent" class="m3-input !mb-3 !p-3" placeholder="Write a note..." rows="3" required></textarea><label class="block text-sm text-[var(--m3-text-muted)] font-medium mb-1 ml-1">Reminder Date & Time</label><input type="datetime-local" id="noteReminder" class="m3-input !mb-4 !p-3"><button type="submit" id="noteSubmitBtn" class="m3-btn !mt-0 !py-3">Save Note</button></form><div id="notesListContainer" class="flex flex-col gap-2"></div></main></div><div id="tab-links" class="tab-content bg-[var(--m3-surface)]"><header class="search-header flex items-center justify-between"><h2 class="text-xl font-semibold text-[var(--m3-text-main)]">My Links</h2></header><main class="scroll-area px-4"><form id="linkForm" class="bg-white p-4 rounded-2xl shadow-sm mb-6 border border-[var(--m3-surface-container)]"><input type="hidden" id="editLinkId" value=""><input type="text" id="linkName" class="m3-input !mb-3 !p-3" placeholder="Website Name" required><input type="url" id="linkUrl" class="m3-input !mb-4 !p-3" placeholder="https://..." required><button type="submit" id="linkSubmitBtn" class="m3-btn !mt-0 !py-3">Add Link</button><button type="button" id="linkCancelBtn" class="m3-btn !mt-2 !py-3 !bg-transparent !text-[var(--m3-text-main)] border border-[var(--m3-outline-variant)] hidden">Cancel Edit</button></form><div id="linksListContainer" class="flex flex-col gap-2"></div></main></div><div id="tab-ai" class="tab-content bg-[var(--m3-surface)] h-full flex flex-col relative"><header class="search-header flex items-center justify-between shrink-0 z-10 shadow-sm border-b border-[var(--m3-surface-container)]"><div class="flex items-center gap-2"><i data-lucide="sparkles" class="w-5 h-5 text-[#8A2BE2]"></i><h2 class="text-xl font-semibold text-[var(--m3-text-main)]">AI Assistant</h2></div></header><div id="chatHistory" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 pb-[100px]"><div class="bg-[var(--m3-surface-container)] text-[var(--m3-text-main)] p-3 rounded-2xl rounded-tl-sm self-start max-w-[85%] text-sm">Hi! I'm your CM Contacts AI Assistant. Ask me to search clients, summarize notes, or answer questions!</div></div><div class="absolute bottom-[80px] left-0 right-0 p-3 bg-[var(--m3-surface)] border-t border-[var(--m3-surface-container)] z-10"><form id="aiChatForm" class="flex gap-2 items-center"><input type="text" id="aiInput" class="m3-input !mb-0 !p-3 flex-1 !rounded-full" placeholder="Ask about clients, notes..." required autocomplete="off"><button type="submit" id="aiSendBtn" class="w-11 h-11 rounded-full bg-[var(--m3-primary)] text-white flex items-center justify-center shrink-0 disabled:opacity-50"><i data-lucide="send" class="w-5 h-5 ml-1"></i></button></form></div></div><nav class="bottom-nav"><button class="nav-item active" data-target="tab-contacts"><div class="nav-icon-container"><i data-lucide="users" class="w-[22px] h-[22px]"></i></div><span class="nav-label">Contacts</span></button><button class="nav-item" data-target="tab-notes"><div class="nav-icon-container"><i data-lucide="file-text" class="w-[22px] h-[22px]"></i></div><span class="nav-label">Notes</span></button><button class="nav-item" data-target="tab-links"><div class="nav-icon-container"><i data-lucide="link" class="w-[22px] h-[22px]"></i></div><span class="nav-label">My Links</span></button><button class="nav-item" data-target="tab-ai"><div class="nav-icon-container"><i data-lucide="sparkles" class="w-[22px] h-[22px]"></i></div><span class="nav-label">Assistant</span></button></nav></div></div><div id="iframeModal" class="fixed inset-0 bg-black/50 z-[100] hidden flex-col items-center justify-end"><div class="bg-[var(--m3-surface)] w-full max-w-[412px] h-[85vh] rounded-t-3xl flex flex-col shadow-2xl"><div class="p-3 flex justify-between items-center border-b border-[var(--m3-surface-container)]"><div class="flex items-center gap-2 overflow-hidden px-2"><i data-lucide="globe" class="w-5 h-5 text-[var(--m3-text-muted)] shrink-0"></i><h3 id="iframeTitle" class="font-semibold text-[var(--m3-text-main)] truncate text-sm"></h3></div><button onclick="window.closeIframe()" class="p-2 bg-[var(--m3-surface-container)] rounded-full text-[var(--m3-text-main)] shrink-0 hover:bg-[var(--m3-surface-container-high)] border-none"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="flex-1 w-full bg-white relative"><div class="absolute inset-0 flex items-center justify-center z-0 bg-white"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[var(--m3-primary)]"></div></div><iframe id="contentIframe" class="w-full h-full border-none z-10 relative bg-transparent" sandbox="allow-scripts allow-same-origin allow-forms"></iframe></div></div></div><script type="module" src="./app.js"></script></body></html>
