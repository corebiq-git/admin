<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Filings</title>
    
    <!-- Google Fonts: Inter for typography, Material Symbols for icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            /* Material 3 Tonal Spot Theme (Light) */
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            
            --md-sys-color-secondary: #625B71;
            --md-sys-color-on-secondary: #FFFFFF;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
            
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-surface-variant: #E7E0EC;
            --md-sys-color-on-surface-variant: #49454F;
            
            --md-sys-color-outline: #79747E;
            --md-sys-color-error: #B3261E;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Material Symbols Setup */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* M3 Component Emulations */
        .m3-card {
            background-color: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
            border-radius: 24px; /* Signature M3 large rounded corners */
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        
        .m3-card:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .m3-fab {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
        }

        .m3-fab:hover {
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            background-color: #d8c4f9;
        }

        .m3-button-primary {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border-radius: 100px;
        }

        .m3-button-text {
            color: var(--md-sys-color-primary);
            border-radius: 100px;
        }

        .m3-button-text:hover {
            background-color: rgba(103, 80, 164, 0.08);
        }

        /* M3 Filled Text Field */
        .m3-input {
            background-color: var(--md-sys-color-surface-variant);
            border-radius: 4px 4px 0 0;
            border-bottom: 1px solid var(--md-sys-color-outline);
            color: var(--md-sys-color-on-surface);
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        
        .m3-input:focus {
            outline: none;
            border-bottom: 2px solid var(--md-sys-color-primary);
            background-color: #e0d8e6;
        }

        /* Dialog Backdrop */
        #filingDialog::backdrop {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
        }

        /* Snackbar */
        .snackbar {
            visibility: hidden;
            min-width: 250px;
            background-color: #313033; /* Inverse surface */
            color: #F4EFF4; /* Inverse on-surface */
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s, bottom 0.3s;
        }

        .snackbar.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <header class="flex items-center justify-between px-4 py-4 md:px-8 md:py-6" style="background-color: var(--md-sys-color-surface);">
        <div class="flex items-center gap-3">
            <button class="p-2 rounded-full hover:bg-black/5 transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined text-[28px]">menu</span>
            </button>
            <h1 class="text-2xl font-semibold tracking-tight">CM Filings</h1>
        </div>
        <div class="flex items-center gap-2">
            <button class="p-2 rounded-full hover:bg-black/5 transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined text-[28px]">search</span>
            </button>
            <button class="p-2 rounded-full hover:bg-black/5 transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined text-[28px]">account_circle</span>
            </button>
        </div>
    </header>

    <main class="flex-grow w-full max-w-4xl mx-auto px-4 py-2 flex flex-col gap-4">
        
        <!-- Filter/Chip Section -->
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
            <button class="px-4 py-1.5 rounded-lg border border-[var(--md-sys-color-outline)] text-[var(--md-sys-color-on-surface)] text-sm font-medium hover:bg-black/5 whitespace-nowrap">All Filings</button>
            <button class="px-4 py-1.5 rounded-lg border border-[var(--md-sys-color-outline)] text-[var(--md-sys-color-on-surface)] text-sm font-medium hover:bg-black/5 whitespace-nowrap">Pending</button>
            <button class="px-4 py-1.5 rounded-lg border border-[var(--md-sys-color-outline)] text-[var(--md-sys-color-on-surface)] text-sm font-medium hover:bg-black/5 whitespace-nowrap">Approved</button>
        </div>

        <!-- Filings Container -->
        <div id="filingsContainer" class="flex flex-col gap-4 mt-4 pb-24">
            <!-- Filings will be injected here by JavaScript -->
            <div class="text-center text-gray-500 py-10" id="emptyState">
                <span class="material-symbols-outlined text-6xl mb-2">folder_open</span>
                <p>No filings found. Create a new one.</p>
            </div>
        </div>

    </main>

    <!-- Floating Action Button -->
    <button onclick="openDialog()" class="m3-fab fixed bottom-8 right-8 w-16 h-16 flex items-center justify-center">
        <span class="material-symbols-outlined text-3xl">add</span>
    </button>

    <!-- New Filing Dialog -->
    <dialog id="filingDialog" class="rounded-[28px] p-0 w-[90%] max-w-[400px] border-0 shadow-2xl bg-[var(--md-sys-color-surface)]">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold">New Filing</h2>
                <button onclick="closeDialog()" class="p-1 rounded-full hover:bg-black/5 flex items-center justify-center text-[var(--md-sys-color-on-surface-variant)]">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <form id="filingForm" class="flex flex-col gap-5">
                <div class="flex flex-col">
                    <label class="text-xs font-medium text-[var(--md-sys-color-on-surface-variant)] mb-1 px-1">Case Number</label>
                    <input type="text" id="caseNum" required class="m3-input px-4 py-3" placeholder="e.g. CV-2023-01">
                </div>
                
                <div class="flex flex-col">
                    <label class="text-xs font-medium text-[var(--md-sys-color-on-surface-variant)] mb-1 px-1">Document Title</label>
                    <input type="text" id="docTitle" required class="m3-input px-4 py-3" placeholder="Motion to Dismiss">
                </div>

                <div class="flex flex-col">
                    <label class="text-xs font-medium text-[var(--md-sys-color-on-surface-variant)] mb-1 px-1">Filing Type</label>
                    <select id="filingType" required class="m3-input px-4 py-3 appearance-none">
                        <option value="Motion">Motion</option>
                        <option value="Brief">Brief</option>
                        <option value="Affidavit">Affidavit</option>
                        <option value="Notice">Notice</option>
                    </select>
                </div>

                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeDialog()" class="m3-button-text px-6 py-2.5 font-medium transition-colors">Cancel</button>
                    <button type="submit" class="m3-button-primary px-6 py-2.5 font-medium shadow hover:shadow-md transition-shadow">Save Filing</button>
                </div>
            </form>
        </div>
    </dialog>

    <!-- Snackbar for notifications -->
    <div id="snackbar" class="snackbar">Message</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXyKSTlmlzkYnH2LW408cVVWV1CPvlfBo",
            authDomain: "cmfilings-6a37c.firebaseapp.com",
            projectId: "cmfilings-6a37c",
            storageBucket: "cmfilings-6a37c.firebasestorage.app",
            messagingSenderId: "138705123778",
            appId: "1:138705123778:web:9561bff9f0f5d89bb6fe5b",
            measurementId: "G-09DM4NZF8D"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Required app context vars
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'cm-filings-app';
        let currentUser = null;
        let unsubscribeFilings = null;

        const container = document.getElementById('filingsContainer');
        const emptyState = document.getElementById('emptyState');
        const dialog = document.getElementById('filingDialog');
        const form = document.getElementById('filingForm');

        // UI Helpers
        function showSnackbar(message) {
            const sb = document.getElementById("snackbar");
            sb.textContent = message;
            sb.classList.add("show");
            setTimeout(() => { sb.classList.remove("show"); }, 3000);
        }

        function getStatusColor(status) {
            if(status === 'Approved') return 'bg-green-100 text-green-800 border border-green-200';
            if(status === 'Pending') return 'bg-amber-100 text-amber-800 border border-amber-200';
            return 'bg-gray-100 text-gray-800 border border-gray-200';
        }

        function getIconForType(type) {
            const map = {
                'Motion': 'gavel',
                'Brief': 'article',
                'Affidavit': 'badge',
                'Notice': 'notifications'
            };
            return map[type] || 'description';
        }

        function renderFilingCard(filing) {
            return `
                <div class="m3-card p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 cursor-pointer">
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 rounded-full bg-[var(--md-sys-color-secondary-container)] text-[var(--md-sys-color-on-secondary-container)] flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined">${getIconForType(filing.type)}</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-semibold text-[var(--md-sys-color-primary)] mb-0.5">${filing.caseNum}</span>
                            <h3 class="text-lg font-semibold text-[var(--md-sys-color-on-surface)] leading-tight mb-1">${filing.title}</h3>
                            <div class="flex items-center gap-2 text-sm text-[var(--md-sys-color-on-surface-variant)]">
                                <span>${filing.date}</span>
                                <span>&bull;</span>
                                <span>${filing.type}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center self-start md:self-center shrink-0 ml-16 md:ml-0">
                        <span class="px-3 py-1 rounded-full text-xs font-semibold ${getStatusColor(filing.status)}">
                            ${filing.status}
                        </span>
                        <button class="ml-4 p-2 rounded-full hover:bg-black/5 text-[var(--md-sys-color-on-surface-variant)]">
                            <span class="material-symbols-outlined">more_vert</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function getCollectionRef() {
            // Strictly storing data isolated per user
            return collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'filings');
        }

        function loadFilings() {
            if (!currentUser) return;
            
            container.innerHTML = '<div class="flex justify-center p-8"><span class="material-symbols-outlined animate-spin text-4xl text-[var(--md-sys-color-primary)]">sync</span></div>';
            
            // Simple query fetching all user data
            const q = query(getCollectionRef());
            
            unsubscribeFilings = onSnapshot(q, (snapshot) => {
                const filings = [];
                snapshot.forEach((doc) => {
                    filings.push({ id: doc.id, ...doc.data() });
                });
                
                // In-Memory Sorting to prevent requirement of composite Firestore indexes
                filings.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (filings.length === 0) {
                    container.innerHTML = '';
                    container.appendChild(emptyState);
                    emptyState.style.display = 'block';
                } else {
                    emptyState.style.display = 'none';
                    container.innerHTML = filings.map(renderFilingCard).join('');
                }
            }, (error) => {
                console.error("Firestore Snapshot Error:", error);
                showSnackbar("Failed to fetch filings.");
                container.innerHTML = '';
                container.appendChild(emptyState);
            });
        }

        // Attach globals to window since we are in a module script
        window.openDialog = function() {
            dialog.showModal();
        }

        window.closeDialog = function() {
            dialog.close();
            form.reset();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) {
                showSnackbar("Please wait, logging in...");
                return;
            }
            
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Saving...';
            submitBtn.disabled = true;

            const newFiling = {
                caseNum: document.getElementById('caseNum').value,
                title: document.getElementById('docTitle').value,
                type: document.getElementById('filingType').value,
                status: 'Pending',
                date: new Date().toLocaleDateString(),
                createdAt: Date.now()
            };

            try {
                // Rule 3: Guard Firestore write operation under auth
                await addDoc(getCollectionRef(), newFiling);
                
                window.closeDialog();
                showSnackbar("Filing added successfully");
            } catch (error) {
                console.error("Firestore Write Error:", error);
                showSnackbar("Failed to save filing");
            } finally {
                submitBtn.textContent = 'Save Filing';
                submitBtn.disabled = false;
            }
        });

        async function authenticateUser() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Authentication Error:", error);
                showSnackbar("Could not authenticate user");
            }
        }

        // Listen for auth state to start querying DB
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadFilings();
            } else {
                currentUser = null;
                if (unsubscribeFilings) unsubscribeFilings();
            }
        });

        // Initialize App
        window.addEventListener('DOMContentLoaded', authenticateUser);

    </script>
</body>
</html>
