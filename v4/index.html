const names=['clients','compliance','invoices','credentials','reminders','payments','documents'],D={};names.forEach(x=>D[x]=[]);const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),client=id=>D.clients.find(x=>x.id===id)?.name||'Unknown';
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}
window.toggleSidebar=()=>{const s=$('sidebar'),o=$('overlay'),open=s.classList.contains('-translate-x-full');s.classList.toggle('-translate-x-full',!open);o.classList.toggle('hidden',!open)};
window.go=v=>{document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));let el=$(v);if(!el){buildView(v);el=$(v)}el.classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('nav-active',x.dataset.v===v));$('title').textContent=v==='calendar'?'Due Calendar':v.replace(/(^|_)/g,' ').replace(/^./,m=>m.toUpperCase());render();if(innerWidth<1024)toggleSidebar()};document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>go(x.dataset.v));
function buildView(v){const titles={clients:['Clients','Client master and service profile.'],compliance:['Compliance Management','Track each filing, due date, status and invoice.'],invoices:['Invoices','Invoice of each compliance and payment status.'],credentials:['Credentials','Client credentials and access details.'],calendar:['Due Date Calendar','Upcoming compliance deadlines.'],reminders:['Reminders','Client and compliance follow-ups.'],payments:['Payment Requests','Send and track payment requests.'],documents:['Documents','Upload, view and organize documents.'],settings:['Settings','Firebase connection and account.']};const [h,p]=titles[v];const add=v==='clients'?'client':v==='compliance'?'compliance':v==='invoices'?'invoice':v==='credentials'?'credential':v==='reminders'?'reminder':v==='payments'?'payment':null;let body='';if(v==='calendar')body='<div id="calendarGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>';else if(v==='reminders')body='<div id="remList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>';else if(v==='documents')body='<div class="bg-white rounded-[24px] p-6 shadow-sm border mb-6"><div class="grid md:grid-cols-3 gap-4"><div><label>Client</label><select id="docClient"></select></div><div><label>Document Type</label><input id="docType" placeholder="ITR acknowledgement, GST return..."></div><div><label>File</label><input id="docFile" type="file"></div></div><button onclick="uploadDoc()" class="mt-4 bg-m3-primary text-white rounded-full px-5 py-3">Upload Document</button></div><div id="docList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>';else if(v==='settings')body='<div class="bg-white rounded-[24px] p-6 shadow-sm max-w-xl"><p id="fbStatus" class="text-sm mb-5">Firebase status</p><button onclick="login()" class="bg-m3-primary text-white rounded-full px-5 py-3">Sign in with Google</button> <button onclick="logout()" class="border rounded-full px-5 py-3">Sign out</button></div>';else body='<div class="bg-white rounded-[24px] shadow-sm border overflow-auto"><table class="w-full text-left min-w-[850px]"><thead class="bg-gray-50"><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>';$('dynamic').innerHTML=`<section id="${v}" class="view"><div class="flex justify-between items-center mb-6"><div><h2 class="text-3xl font-semibold">${h}</h2><p class="text-m3-on-surface-variant">${p}</p></div>${add?`<button onclick="modal('${add}')" class="bg-m3-primary text-white rounded-full px-5 py-3"><span class="material-symbols-rounded align-middle">add</span> Add</button>`:''}</div>${body}</section>`}
const cfg={client:{title:'Add Client',c:'clients',f:[['name','Client Name','text',1],['phone','Phone','tel'],['email','Email','email'],['gstin','GSTIN','text'],['pan','PAN','text'],['address','Address','text']]},compliance:{title:'Add Compliance',c:'compliance',f:[['name','Compliance Name','text',1],['clientId','Client','client',1],['period','Return / Period','text',1],['dueDate','Due Date','date',1],['status','Status','status',1],['fee','Fee','number'],['notes','Notes','textarea']]},invoice:{title:'Create Invoice',c:'invoices',f:[['invoiceNo','Invoice Number','text',1],['clientId','Client','client',1],['complianceId','Compliance','compliance'],['amount','Amount','number',1],['dueDate','Due Date','date',1],['status','Status','invoiceStatus',1],['notes','Notes','textarea']]},credential:{title:'Add Credential',c:'credentials',f:[['clientId','Client','client',1],['type','Credential Type','text',1],['username','Username','text'],['password','Password / PIN','text'],['notes','Notes','textarea']]},reminder:{title:'Add Reminder',c:'reminders',f:[['clientId','Client','client',1],['title','Reminder','text',1],['dueDate','Date','date',1],['channel','Channel','text'],['status','Status','reminderStatus',1],['notes','Notes','textarea']]},payment:{title:'Payment Request',c:'payments',f:[['clientId','Client','client',1],['purpose','Purpose','text',1],['amount','Amount','number',1],['dueDate','Due Date','date',1],['status','Status','paymentStatus',1],['link','Payment Link','url']]}};
window.modal=t=>{const x=cfg[t];$('mTitle').textContent=x.title;$('form').dataset.c=x.c;$('form').innerHTML=x.f.map(([k,l,ty,req])=>{if(ty==='client')return `<div><label>${l}</label><select name="${k}" ${req?'required':''}><option value="">Select client</option>${D.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>`;if(ty==='compliance')return `<div><label>${l}</label><select name="${k}"><option value="">None</option>${D.compliance.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(client(c.clientId))}</option>`).join('')}</select></div>`;if(/status/i.test(ty)){let o=ty==='status'?['Pending','In Progress','Filed','Completed','Overdue']:ty==='invoiceStatus'?['Draft','Sent','Paid','Overdue','Cancelled']:ty==='reminderStatus'?['Pending','Sent','Completed']:['Pending','Sent','Paid','Cancelled'];return `<div><label>${l}</label><select name="${k}" required>${o.map(a=>`<option>${a}</option>`).join('')}</select></div>`}return `<div class="${ty==='textarea'?'md:col-span-2':''}"><label>${l}</label>${ty==='textarea'?`<textarea name="${k}" rows="3"></textarea>`:`<input name="${k}" type="${ty}" ${req?'required':''} ${ty==='date'?`value="${today()}"`:''}>`}</div>`}).join('')+`<div class="md:col-span-2 flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-5 py-3 rounded-full border">Cancel</button><button class="px-5 py-3 rounded-full bg-m3-primary text-white">Save</button></div>`;$('modal').classList.remove('hidden');$('modal').classList.add('flex')};window.closeModal=()=>{$('modal').classList.add('hidden');$('modal').classList.remove('flex')};
$('form').onsubmit=async e=>{e.preventDefault();if(!firebaseReady)return toast('Configure firebase-config.js first');const c=e.target.dataset.c,o=Object.fromEntries(new FormData(e.target));o.createdAt=serverTimestamp();o.updatedAt=serverTimestamp();try{await addDoc(collection(db,c),o);closeModal();toast('Saved successfully');await load()}catch(err){toast(err.message)}};
async function load(){if(!firebaseReady){render();return}for(const n of names){const s=await getDocs(collection(db,n));D[n]=s.docs.map(d=>({id:d.id,...d.data()}))}render()}
function status(x){return `<span class="inline-flex px-3 py-1 rounded-full text-xs font-medium bg-gray-100 border">${esc(x||'—')}</span>`}function rows(cells){return cells.map(x=>`<td class="px-6 py-4">${x}</td>`).join('')}
function render(){ $('sClients').textContent=D.clients.length;$('sCompliance').textContent=D.compliance.filter(x=>!['Completed','Filed'].includes(x.status)).length;$('sInvoices').textContent=D.invoices.filter(x=>x.status!=='Paid').length;const due=D.compliance.filter(x=>x.dueDate&&x.dueDate<=new Date(Date.now()+7*864e5).toISOString().slice(0,10)&&!['Completed','Filed'].includes(x.status)).length;$('sDue').textContent=due;$('dueBadge').textContent=due;$('dashList').innerHTML=D.compliance.slice(0,6).map(x=>`<div class="flex items-center gap-3 p-3 rounded-2xl bg-gray-50"><span class="material-symbols-rounded text-m3-primary">task_alt</span><div class="flex-1"><p class="font-medium">${esc(x.name)}</p><p class="text-xs text-m3-on-surface-variant">${esc(client(x.clientId))} · ${esc(x.dueDate)}</p></div>${status(x.status)}</div>`).join('')||'<p class="text-sm text-gray-500">No compliance records.</p>';const v=document.querySelector('.view.active')?.id;if(v&&v!=='dashboard')renderSection(v)}
function renderSection(v){const head={clients:['Client','Phone','Email','GSTIN','Status',''],compliance:['Compliance','Client','Period','Due Date','Status','Invoice',''],invoices:['Invoice','Client','Compliance','Amount','Due','Status',''],credentials:['Client','Type','Username','Password','Updated',''],payments:['Client','Purpose','Amount','Due','Status','']};if(head[v]){$('thead').innerHTML=head[v].map(x=>`<th class="px-6 py-4 text-xs uppercase">${x}</th>`).join('');let arr=D[v];$('tbody').innerHTML=arr.map(x=>{if(v==='clients')return `<tr>${rows([`<b>${esc(x.name)}</b><br><small>${esc(x.pan||'')}</small>`,esc(x.phone),esc(x.email),esc(x.gstin),status(x.status||'Active'),del(v,x.id)])}</tr>`;if(v==='compliance')return `<tr>${rows([esc(x.name),esc(client(x.clientId)),esc(x.period),esc(x.dueDate),status(x.status),status(D.invoices.find(i=>i.complianceId===x.id)?.status||'No invoice'),del(v,x.id)])}</tr>`;if(v==='invoices')return `<tr>${rows([esc(x.invoiceNo||'INV-'+x.id.slice(0,6)),esc(client(x.clientId)),esc(D.compliance.find(c=>c.id===x.complianceId)?.name||'—'),'₹'+Number(x.amount||0).toLocaleString('en-IN'),esc(x.dueDate),status(x.status),del(v,x.id)])}</tr>`;if(v==='credentials')return `<tr>${rows([esc(client(x.clientId)),esc(x.type),esc(x.username),'••••••••','—',del(v,x.id)])}</tr>`;return `<tr>${rows([esc(client(x.clientId)),esc(x.purpose), '₹'+Number(x.amount||0).toLocaleString('en-IN'),esc(x.dueDate),status(x.status),del(v,x.id)])}</tr>`}).join('')||`<tr><td colspan="7" class="px-6 py-10 text-center text-gray-500">No records yet.</td></tr>`}if(v==='calendar')$('calendarGrid').innerHTML=D.compliance.sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')).map(x=>`<div class="p-5 rounded-2xl border bg-gray-50"><b>${esc(x.name)}</b><p class="text-sm text-gray-500">${esc(client(x.clientId))}</p><p class="mt-3 font-medium">📅 ${esc(x.dueDate)}</p>${status(x.status)}</div>`).join('')||'<p>No due dates.</p>';if(v==='reminders')$('remList').innerHTML=D.reminders.map(x=>`<div class="bg-white rounded-[24px] p-5 border shadow-sm"><span class="material-symbols-rounded text-m3-primary">notifications</span><h3 class="font-semibold mt-3">${esc(x.title)}</h3><p class="text-sm text-gray-500">${esc(client(x.clientId))}</p><p class="mt-3">${esc(x.dueDate)} · ${status(x.status)}</p></div>`).join('')||'<p>No reminders.</p>';if(v==='documents'){if($('docClient'))$('docClient').innerHTML='<option value="">Select client</option>'+D.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');if($('docList'))$('docList').innerHTML=D.documents.map(x=>`<div class="bg-white rounded-[24px] p-5 border shadow-sm"><span class="material-symbols-rounded text-m3-primary">description</span><h3 class="font-semibold mt-3 truncate">${esc(x.fileName)}</h3><p class="text-sm text-gray-500">${esc(client(x.clientId))}</p><a href="${esc(x.url)}" target="_blank" class="inline-block mt-4 bg-m3-primary text-white rounded-full px-4 py-2 text-sm">View Document</a></div>`).join('')||'<p>No documents.</p>'}if(v==='settings'&&$('fbStatus'))$('fbStatus').textContent=firebaseReady?'Firebase connected':'Firebase config required'}function del(c,id){return `<button onclick="removeRec('${c}','${id}')" class="text-m3-error"><span class="material-symbols-rounded">delete</span></button>`}
window.removeRec=async(c,id)=>{if(!confirm('Delete this record?'))return;await deleteDoc(doc(db,c,id));toast('Deleted');load()};window.quickAdd=()=>modal('client');window.login=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){toast(e.message)}};window.logout=()=>signOut(auth);window.uploadDoc=async()=>{const f=$('docFile').files[0],cid=$('docClient').value;if(!f||!cid)return toast('Select client and file');if(!firebaseReady)return toast('Configure Firebase first');try{const r=ref(storage,`documents/${cid}/${Date.now()}_${f.name}`);await uploadBytes(r,f);const url=await getDownloadURL(r);await addDoc(collection(db,'documents'),{clientId:cid,type:$('docType').value,fileName:f.name,url,createdAt:serverTimestamp()});toast('Uploaded');load()}catch(e){toast(e.message)}};
if(firebaseReady)onAuthStateChanged(auth,u=>{if(u){$('userName').textContent=u.displayName||'Admin';$('userEmail').textContent=u.email||'';$('avatar').textContent=(u.displayName||'A')[0].toUpperCase()}load()});else load();
</script></body></html>
