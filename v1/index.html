<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B10000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo.svg">
<title>CM Filings Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cm-filings.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="assets/logo.svg" alt="CM"></div>
      <div><strong>CM FILINGS</strong><small>Tax • Compliance • Advisory</small></div>
    </div>
    <nav id="sideNav">
      <button data-view="dashboard" class="nav-item active"><i class="fa-solid fa-chart-pie"></i>Dashboard</button>
      <button data-view="clients" class="nav-item"><i class="fa-solid fa-users"></i>Clients</button>
      <button data-view="compliance" class="nav-item"><i class="fa-solid fa-list-check"></i>Compliance</button>
      <button data-view="invoices" class="nav-item"><i class="fa-solid fa-file-invoice"></i>Invoices</button>
      <button data-view="payments" class="nav-item"><i class="fa-solid fa-indian-rupee-sign"></i>Payments</button>
      <button data-view="calendar" class="nav-item"><i class="fa-regular fa-calendar-days"></i>Calendar</button>
      <button data-view="documents" class="nav-item"><i class="fa-solid fa-folder-open"></i>Documents</button>
      <button data-view="credentials" class="nav-item"><i class="fa-solid fa-key"></i>Credentials</button>
      <button data-view="reminders" class="nav-item"><i class="fa-regular fa-bell"></i>Reminders</button>
      <button data-view="settings" class="nav-item"><i class="fa-solid fa-gear"></i>Settings</button>
    </nav>
    <div class="sidebar-footer">
      <div class="cloud-state"><span></span><div><b id="dataMode">Local Mode</b><small>Data engine</small></div></div>
      <button class="primary full" data-action="new-client"><i class="fa-solid fa-plus"></i> New Client</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
      <div class="page-heading"><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">CM Filings compliance workspace</p></div>
      <div class="top-actions">
        <div class="search-global"><i class="fa-solid fa-magnifying-glass"></i><input id="globalSearch" placeholder="Search clients, invoices..."></div>
        <button class="icon-btn" data-view="reminders"><i class="fa-regular fa-bell"></i><span class="notification-dot"></span></button>
        <div class="avatar">AD</div>
      </div>
    </header>

    <section class="content" id="viewContainer"></section>
  </main>
</div>

<div class="mobile-nav" id="mobileNav">
  <button data-view="dashboard"><i class="fa-solid fa-chart-pie"></i><span>Home</span></button>
  <button data-view="clients"><i class="fa-solid fa-users"></i><span>Clients</span></button>
  <button data-view="compliance"><i class="fa-solid fa-list-check"></i><span>Work</span></button>
  <button data-view="payments"><i class="fa-solid fa-indian-rupee-sign"></i><span>Payments</span></button>
  <button data-view="documents"><i class="fa-solid fa-folder-open"></i><span>Docs</span></button>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
